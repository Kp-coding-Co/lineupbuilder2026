                const bg = i % 2 === 0 ? C.surface : C.surfaceAlt;
                const usage = usageByPlayer[p.id] || {};
                return (
                  <tr key={p.id}>
                    <td style={{ ...tdStyle, background: bg, textAlign: "center", color: C.accent, fontWeight: 600, padding: "3px 2px", fontSize: 12 }}>{p.number || "—"}</td>
                    <td style={{ ...tdStyle, background: bg, fontWeight: 600, padding: "3px 2px 3px 10px", fontSize: 13 }}>{p.name}</td>
                    {ALL_POS.map(pos => {
                      const count = usage[pos] || 0;
                      const heat = count > 0 ? heatColor(count, usageRange.min, usageRange.max) : null;
                      return (
                        <td key={pos} style={{
                          ...tdStyle, textAlign: "center", padding: "3px 2px",
                          background: heat || bg,
                          color: count > 0 ? C.text : C.textLight,
                          fontWeight: count > 0 ? 700 : 400,
                          fontSize: 12,
                        }}>{formatUsage(count)}</td>
                      );
                    })}
                    {(() => {
                      const count = usage.BN || 0;
                      return (
                        <td key="BN" style={{
                          ...tdStyle, textAlign: "center", padding: "3px 2px",
                          background: bg,
                          color: count > 0 ? C.textMuted : C.textLight,
                          fontWeight: count > 0 ? 600 : 400,
                          fontSize: 12,
                          fontStyle: "italic",
                          borderLeft: `2px solid ${C.border}`,
                        }}>{formatUsage(count)}</td>
                      );
                    })()}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {/* Arm Care — embedded here so all read-mostly team data lives on a
          single page. Uses the standalone ArmCareTab component as-is. */}
      <div style={{ marginBottom: 32 }}>
        {sectionHeader("Arm Care", "Pitcher rest tracker, status, and pitch log history.")}
        <ArmCareTab roster={roster} pitchLogs={pitchLogs} setPitchLogs={setPitchLogs} schedule={schedule} />
      </div>

      {/* Depth Chart — one column per field position (no P, no BN). Players
          stack vertically as tier-colored chips: green = preferred,
          yellow = secondary, orange = emergency. Within a tier, sorted by rank. */}
      <div style={{ marginBottom: 32 }}>
        {sectionHeader("Depth Chart", "Players at each field position, stacked by tier (green = preferred, yellow = secondary, orange = emergency).")}
        <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: 10, overflowX: "auto" }}>
          <div style={{ display: "grid", gridTemplateColumns: `repeat(${FIELD_POS.length}, minmax(70px, 1fr))`, gap: 6 }}>
            {FIELD_POS.map(pos => {
              const players = [
                ...(depthChart.preferred[pos] || []).map(p => ({ p, tier: "preferred" })),
                ...(depthChart.secondary[pos] || []).map(p => ({ p, tier: "secondary" })),
                ...(depthChart.emergency[pos] || []).map(p => ({ p, tier: "emergency" })),
              ];
              return (
                <div key={pos} style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  <div style={{ ...thStyle, padding: "6px 4px", textAlign: "center", borderBottom: "none", borderRadius: 4 }}>{pos}</div>
                  {players.length === 0 && (
                    <div style={{ color: C.textLight, fontSize: 12, textAlign: "center", padding: "8px 0", fontStyle: "italic" }}>—</div>
                  )}
                  {players.map(({ p, tier }) => (
                    <div key={`${pos}-${p.id}-${tier}`} style={{
                      background: TIER_BG[tier],
                      color: TIER_COLORS[tier],
                      border: `1px solid ${TIER_COLORS[tier]}`,
                      padding: "5px 6px",
                      borderRadius: 4,
                      fontSize: 12,
                      fontWeight: 600,
                      textAlign: "center",
                    }}>{p.name}</div>
                  ))}
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* Roster Priority \u2014 combined positional + bench priority editor.
          Same component is rendered in SetupTab; both read App-level state
          so edits in either place are reflected in the other. */}
      <PriorityMatrix roster={roster} setRoster={setRoster} benchTiers={benchTiers} setBenchTiers={setBenchTiers} />
    </div>
  );
}

// ══════════════════════════════════════════════════
// ARM CARE TAB
// ══════════════════════════════════════════════════
function ArmCareTab({ roster, pitchLogs, setPitchLogs, canEdit = true, schedule = [] }) {
  const [sortCol, setSortCol] = useState("name");
  const [sortDir, setSortDir] = useState("asc");
  const [logPitcher, setLogPitcher] = useState("");
  const [logPitches, setLogPitches] = useState("");
  const [logDate, setLogDate] = useState(new Date().toISOString().slice(0, 10));
  const [logOpponent, setLogOpponent] = useState("");
  const [rulesOpen, setRulesOpen] = useState(false);
  // Placeholder info modal for the import buttons. Set to null to close, or
  // to { title, body } to open with that content.
  const [importInfo, setImportInfo] = useState(null);
  // "As-of" date: defaults to wall-clock today but the coach can scrub to any
  // date to see what the team's pitch state would have looked like / will look
  // like on that day.
  const wallClockToday = new Date().toISOString().slice(0, 10);
  const [today, setToday] = useState(wallClockToday);
  // When true, planned pitches from future saved lineups are folded into the
  // 7d/14d/30d totals and the Status calculation. Lets the coach scrub the
  // as-of date forward and see what each pitcher's situation will look like
  // under the current plan. Defaults to true so the season-planning view is
  // the default — toggle off to see only actual logged outings.
  const [includeProjected, setIncludeProjected] = useState(true);
  const pitchers = roster.filter(p => p.positionMap?.P);

  // Synthesize "projected" pitch entries from saved future-game lineups.
  // Only future, unplayed games are included — played games are already
  // represented by real entries in pitchLogs.
  const projectedLogs = useMemo(() => {
    if (!includeProjected) return [];
    const out = [];
    schedule.forEach(g => {
      if (!g?.lineup?.pitcherAssignments) return;
      if (!g.date || g.date < wallClockToday) return;
      if (g.played) return;
      g.lineup.pitcherAssignments.forEach(pa => {
        out.push({
          id: `proj_${g.id}_${pa.id}`,
          playerId: pa.id,
          pitches: pa.budget || 0,
          date: g.date,
          opponent: g.opponent || "",
          projected: true,
        });
      });
    });
    return out;
  }, [schedule, includeProjected, wallClockToday]);
  const allLogs = useMemo(() => [...pitchLogs, ...projectedLogs], [pitchLogs, projectedLogs]);

  const pitcherData = useMemo(() => pitchers.map(p => {
    const logs = allLogs.filter(l => l.playerId === p.id);
    const daysAgo = (d) => Math.floor((new Date(today) - new Date(d)) / 86400000);
    // Past-only: future-dated logs are ignored across the totals so the
    // 7d/14d/30d numbers stay consistent with the Status column.
    const last7  = logs.filter(l => { const d = daysAgo(l.date); return d >= 0 && d <= 7;  }).reduce((s, l) => s + l.pitches, 0);
    const last14 = logs.filter(l => { const d = daysAgo(l.date); return d >= 0 && d <= 14; }).reduce((s, l) => s + l.pitches, 0);
    const last30 = logs.filter(l => { const d = daysAgo(l.date); return d >= 0 && d <= 30; }).reduce((s, l) => s + l.pitches, 0);
    // Only consider logs at or before today — future-dated logs would
    // produce a negative `daysAgo` and inflate the rest math.
    const recent = logs.filter(l => { const d = daysAgo(l.date); return d >= 0 && d <= 7; }).sort((a, b) => b.date.localeCompare(a.date));
    let available = true, restRemaining = 0, reason = "Available";
    if (recent.length > 0) { const ll = recent[0]; const rn = getRestDays(ll.pitches); const ds = daysAgo(ll.date); restRemaining = Math.max(0, rn - ds); available = restRemaining === 0; reason = available ? "Available" : "Unavailable"; }
    const avail = ARM_CARE.dailyMax - logs.filter(l => l.date === today).reduce((s, l) => s + l.pitches, 0);
    return { ...p, last7, last14, last30, available, restRemaining, reason, availToday: Math.max(0, avail) };
  }), [pitchers, allLogs, today]);

  const sorted = useMemo(() => [...pitcherData].sort((a, b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (sortCol === "name") { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); }
    if (va < vb) return sortDir === "asc" ? -1 : 1;
    if (va > vb) return sortDir === "asc" ? 1 : -1;
    return 0;
  }), [pitcherData, sortCol, sortDir]);

  const toggleSort = (col) => { if (sortCol === col) setSortDir(d => d === "asc" ? "desc" : "asc"); else { setSortCol(col); setSortDir("asc"); } };
  const addLog = () => { if (!logPitcher || !logPitches) return; setPitchLogs(prev => [...prev, { id: Date.now().toString(), playerId: logPitcher, pitches: parseInt(logPitches), date: logDate, opponent: logOpponent }]); setLogPitches(""); setLogOpponent(""); };
  const deleteLog = (id) => setPitchLogs(prev => prev.filter(l => l.id !== id));
  const sortHeader = (label, col, width) => <th onClick={() => toggleSort(col)} style={{ ...thStyle, cursor: "pointer", width, userSelect: "none" }}>{label} {sortCol === col ? (sortDir === "asc" ? "\u25B2" : "\u25BC") : ""}</th>;

  const todayLabel = (() => {
    try {
      const d = new Date(today + "T12:00:00");
      return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    } catch { return today; }
  })();

  return (
    <div>
      <div style={{ marginBottom: 10, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <div style={{ fontSize: 12, color: C.textMuted, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <span>Status, rest, and totals as of</span>
          <input type="date" value={today} onChange={e => setToday(e.target.value || wallClockToday)}
            style={{ background: C.surfaceAlt, border: `1px solid ${C.border}`, color: C.text, padding: "3px 8px", borderRadius: 6, fontFamily: FONT, fontSize: 12, outline: "none" }} />
          <span style={{ color: C.text, fontWeight: 600 }}>({todayLabel})</span>
          {today !== wallClockToday && (
            <button onClick={() => setToday(wallClockToday)} style={{ ...miniChipStyle, fontSize: 11, padding: "2px 8px" }}>Reset to today</button>
          )}
          <button onClick={() => setIncludeProjected(v => !v)}
            title="Add planned pitches from future saved lineups to the totals. Pair with the date scrubber above to see how a pitcher's situation evolves under the plan."
            style={{
              ...miniChipStyle, fontSize: 11, padding: "2px 8px",
              background: includeProjected ? C.accent : C.surface,
              color: includeProjected ? "#fff" : C.textMuted,
              borderColor: includeProjected ? C.accent : C.border,
            }}>
            {includeProjected ? "✓ " : ""}Include projected
          </button>
        </div>
        {/* Import buttons — top right of the Arm Care section. Open a placeholder
            modal explaining what's needed to wire each import format up. */}
        <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
          <button onClick={() => setImportInfo({
            title: "Import GameChanger Data",
            body: "GameChanger import isn't wired up yet. To enable it, share a sample export file (CSV preferred) so the parser can match it column-for-column. Imported entries will override any pitch counts previously entered via Log Pitches for the same player + date.",
          })} style={{ ...chipStyle, padding: "6px 14px", fontSize: 12, fontWeight: 600 }}>Import GC Data</button>
          <button onClick={() => setImportInfo({
            title: "Import Pitch Count",
            body: "League pitch-count import isn't wired up yet. To enable it, share a sample export file from the league tool — or describe the columns / fields it provides — and the parser can be built around it. Imported entries will override any pitch counts previously entered via Log Pitches for the same player + date.",
          })} style={{ ...chipStyle, padding: "6px 14px", fontSize: 12, fontWeight: 600 }}>Import Pitch Count</button>
        </div>
      </div>

      {importInfo && (
        <div onClick={() => setImportInfo(null)} style={{
          position: "fixed", inset: 0, background: "rgba(40,35,30,0.45)",
          display: "flex", alignItems: "center", justifyContent: "center",
          zIndex: 100, padding: 20,
        }}>
          <div onClick={(e) => e.stopPropagation()} style={{
            background: C.surface, color: C.text, borderRadius: 12, padding: 24,
            maxWidth: 460, width: "100%", fontFamily: FONT,
            boxShadow: "0 10px 40px rgba(0,0,0,0.15)",
          }}>
            <h2 style={{ fontFamily: DISPLAY, fontSize: 18, fontWeight: 700, marginBottom: 12, color: C.text }}>{importInfo.title}</h2>
            <p style={{ fontSize: 13, color: C.text, lineHeight: 1.55, marginBottom: 18 }}>{importInfo.body}</p>
            <div style={{ display: "flex", justifyContent: "flex-end" }}>
              <button onClick={() => setImportInfo(null)} style={{
                background: C.accent, border: `1px solid ${C.accent}`, color: "#fff",
                padding: "8px 18px", borderRadius: 6, fontFamily: FONT, fontSize: 13, fontWeight: 600,
                cursor: "pointer",
              }}>Got it</button>
            </div>
          </div>
        </div>
      )}
      <div style={{ overflowX: "auto", marginBottom: 20, borderRadius: 8, boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", background: C.surface, borderRadius: 8 }}>
          <thead><tr>
            {sortHeader("Player", "name", 100)}
            {sortHeader("Status", "available", 80)}
            {sortHeader("Avail", "availToday", 50)}
            {sortHeader("7d", "last7", 45)}
            {sortHeader("14d", "last14", 45)}
            {sortHeader("30d", "last30", 50)}
            <th style={{ ...thStyle, width: 60 }}>ERA</th>
            <th style={{ ...thStyle, width: 60 }}>WHIP</th>
            <th style={{ ...thStyle, width: 50 }}>K%</th>
          </tr></thead>
          <tbody>
            {sorted.map((p, i) => {
              const bg = i % 2 ? C.surfaceAlt : C.surface;
              return (
                <tr key={p.id}>
                  <td style={{ ...tdStyle, background: bg, fontWeight: 600, paddingLeft: 12 }}>{p.name}</td>
                  <td style={{ ...tdStyle, background: bg, textAlign: "center" }}>
                    <span style={{ display: "inline-block", padding: "3px 10px", borderRadius: 12, fontSize: 11, fontWeight: 600, background: p.available ? C.greenLight : C.redLight, color: p.available ? C.greenText : C.redText }}>{p.reason}</span>
                  </td>
                  <td style={{ ...tdStyle, background: bg, textAlign: "center", color: p.availToday > 0 ? C.greenText : C.redText, fontWeight: 600 }}>{p.availToday}</td>
                  <td style={{ ...tdStyle, background: bg, textAlign: "center" }}>{p.last7}</td>
                  <td style={{ ...tdStyle, background: bg, textAlign: "center" }}>{p.last14}</td>
                  <td style={{ ...tdStyle, background: bg, textAlign: "center" }}>{p.last30}</td>
                  <td style={{ ...tdStyle, background: bg, textAlign: "center", color: C.textLight }}>{"\u2014"}</td>
                  <td style={{ ...tdStyle, background: bg, textAlign: "center", color: C.textLight }}>{"\u2014"}</td>
                  <td style={{ ...tdStyle, background: bg, textAlign: "center", color: C.textLight }}>{"\u2014"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {canEdit && (
        <Section title="Log Pitches">
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
            <select value={logPitcher} onChange={e => setLogPitcher(e.target.value)} style={{ ...inputStyle, minWidth: 130 }}>
              <option value="">Pitcher...</option>
              {pitchers.map(p => <option key={p.id} value={p.id}>#{p.number} {p.name}</option>)}
            </select>
            <input type="number" placeholder="Pitches" value={logPitches} onChange={e => setLogPitches(e.target.value)} min={1} max={75} style={{ ...inputStyle, width: 80 }} />
            <input type="date" value={logDate} onChange={e => setLogDate(e.target.value)} style={inputStyle} />
            <input placeholder="Opponent" value={logOpponent} onChange={e => setLogOpponent(e.target.value)} style={{ ...inputStyle, flex: "1 1 80px" }} />
            <button onClick={addLog} style={{ ...chipStyle, background: C.accent, color: "#fff", borderColor: C.accent, padding: "8px 18px", fontWeight: 600 }}>Log</button>
          </div>
        </Section>
      )}

      {pitchLogs.length > 0 && (
        <Section title={`Pitch Log (${pitchLogs.length})`} defaultOpen={false}>
          {[...pitchLogs].reverse().slice(0, 20).map(l => {
            const p = roster.find(r => r.id === l.playerId);
            return (
              <div key={l.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 0", borderBottom: `1px solid ${C.borderLight}`, fontSize: 13 }}>
                <span style={{ fontWeight: 600, minWidth: 75 }}>{p?.name || "?"}</span>
                <span style={{ color: C.accent, fontWeight: 600 }}>{l.pitches}pc</span>
                <span style={{ color: C.textMuted }}>{l.date}</span>
                <span style={{ color: C.textMuted, flex: 1 }}>{l.opponent || ""}</span>
                {canEdit && <button onClick={() => deleteLog(l.id)} style={{ ...miniChipStyle, color: C.red, borderColor: C.red, fontSize: 10, padding: "2px 6px" }}>&times;</button>}
              </div>
            );
          })}
        </Section>
      )}

      <div style={{ marginTop: 20 }}>
        <button onClick={() => setRulesOpen(!rulesOpen)} style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", background: "transparent", border: "none", borderBottom: `1px solid ${C.border}`, padding: "10px 0", cursor: "pointer", fontFamily: FONT }}>
          <span style={{ fontSize: 11, color: C.accent, transform: rulesOpen ? "rotate(90deg)" : "rotate(0deg)", display: "inline-block", transition: "transform .2s" }}>{"\u25B6"}</span>
          <span style={{ fontSize: 13, fontWeight: 600, color: C.textMuted }}>OBA 11U Arm Care Rules</span>
        </button>
        {rulesOpen && (
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderTop: "none", borderRadius: "0 0 8px 8px", padding: 18, fontSize: 13, color: C.textMuted, lineHeight: 2 }}>
            <div style={{ display: "grid", gridTemplateColumns: "auto 1fr", gap: "2px 20px" }}>
              <span style={{ color: C.accent, fontWeight: 600 }}>Daily max:</span><span>75 pitches</span>
              <span style={{ color: C.accent, fontWeight: 600 }}>0 days rest:</span><span>{"1\u201324 pitches"}</span>
              <span style={{ color: C.accent, fontWeight: 600 }}>1 day rest:</span><span>{"25\u201334 pitches"}</span>
              <span style={{ color: C.accent, fontWeight: 600 }}>2 days rest:</span><span>{"35\u201354 pitches"}</span>
              <span style={{ color: C.accent, fontWeight: 600 }}>3 days rest:</span><span>{"55\u201374 pitches"}</span>
              <span style={{ color: C.accent, fontWeight: 600 }}>4 days rest:</span><span>75 pitches</span>
              <span style={{ color: C.accent, fontWeight: 600 }}>Consecutive:</span><span>Max 3 days, never 4</span>
              <span style={{ color: C.accent, fontWeight: 600 }}>Catcher rule:</span><span>Pitcher cannot catch remainder of game</span>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// PITCHING PLAN
// Shared between SetupTab (full game-build flow) and the EditPlanModal
// (in-flight tweaks from the Lineup Editor). Owns the drag-to-reorder
// state internally; consumers just pass the assignments + a setter.
// ══════════════════════════════════════════════════
function PitchingPlan({ roster, pitcherAssignments, setPitcherAssignments, pitcherAvailability, pitchEligible, gameInnings, defaultOpen = true }) {
  const isMobile = useIsMobile();
  const [dragPitcherIdx, setDragPitcherIdx] = useState(null);
  const totalInnings = pitcherAssignments.reduce((s, p) => s + (p.innings || 0), 0);
  // Touch devices: HTML5 drag-and-drop is broken on iOS Safari and laggy
  // on Android Chrome (long-press required). Skip it on mobile and rely on
  // the ↑/↓ arrow buttons, which we make significantly larger below so the
  // tap targets feel right under a thumb.
  const arrowBtnStyle = {
    ...miniChipStyle,
    padding: isMobile ? "8px 14px" : "3px 8px",
    fontSize: isMobile ? 16 : 12,
    minWidth: isMobile ? 44 : 0,
    minHeight: isMobile ? 36 : 0,
    lineHeight: 1,
  };
  const removeBtnStyle = {
    ...miniChipStyle, color: C.red, borderColor: C.red,
    padding: isMobile ? "8px 14px" : undefined,
    fontSize: isMobile ? 16 : undefined,
    minWidth: isMobile ? 44 : 0,
    minHeight: isMobile ? 36 : 0,
    lineHeight: 1,
  };

  const addPitcher = (id) => { if (!pitcherAssignments.some(p => p.id === id)) setPitcherAssignments(prev => [...prev, { id, innings: 2, budget: 54 }]); };
  const removePitcher = (id) => setPitcherAssignments(prev => prev.filter(p => p.id !== id));
  const updatePitcher = (id, field, value) => setPitcherAssignments(prev => prev.map(p => p.id === id ? { ...p, [field]: value } : p));
  const reorderPitcher = (fromIdx, toIdx) => {
    if (fromIdx === toIdx || fromIdx == null || toIdx == null) return;
    setPitcherAssignments(prev => {
      if (fromIdx < 0 || fromIdx >= prev.length) return prev;
      const clamped = Math.max(0, Math.min(toIdx, prev.length - 1));
      const next = [...prev];
      const [moved] = next.splice(fromIdx, 1);
      next.splice(clamped, 0, moved);
      return next;
    });
  };

  return (
    <Section title={`Pitching Plan (${totalInnings}/${gameInnings} inn)`} defaultOpen={defaultOpen} alert={totalInnings < gameInnings ? `Need ${gameInnings - totalInnings} more innings` : null} success={totalInnings >= gameInnings}>
      {pitcherAssignments.map((pa, idx) => {
        const player = roster.find(p => p.id === pa.id);
        const avail = pitcherAvailability ? pitcherAvailability[pa.id] : null;
        const isDragSource = dragPitcherIdx === idx;
        // Drag attributes only attach on non-mobile; phones use the arrows.
        const dragAttrs = isMobile ? {} : {
          draggable: true,
          onDragStart: (e) => { setDragPitcherIdx(idx); try { e.dataTransfer.effectAllowed = "move"; } catch {} },
          onDragOver: (e) => { if (dragPitcherIdx !== null) e.preventDefault(); },
          onDrop: (e) => { e.preventDefault(); if (dragPitcherIdx !== null && dragPitcherIdx !== idx) reorderPitcher(dragPitcherIdx, idx); setDragPitcherIdx(null); },
          onDragEnd: () => setDragPitcherIdx(null),
        };
        return (
          <div
            key={pa.id}
            {...dragAttrs}
            title={isMobile ? undefined : "Drag to reorder, or use the arrows on the right"}
            style={{
              display: "flex", alignItems: "center", gap: 10,
              padding: "10px 0", borderBottom: `1px solid ${C.borderLight}`,
              flexWrap: "wrap", cursor: isMobile ? "default" : "grab",
              opacity: isDragSource ? 0.4 : 1,
              background: isDragSource ? C.surfaceAlt : "transparent",
              transition: "opacity 0.1s, background 0.1s",
            }}
          >
            <span style={{ color: C.accent, fontWeight: 700, width: 22, textAlign: "center", fontSize: 14, userSelect: "none" }}>{idx + 1}</span>
            <span style={{ fontWeight: 600, minWidth: 80, fontSize: 14 }}>{player?.name}</span>
            <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
              <label style={{ fontSize: 12, color: C.textMuted }}>Inn:</label>
              {[1,2,3,4,5,6,7].map(n => <button key={n} onClick={() => updatePitcher(pa.id, "innings", n)} style={{ ...miniChipStyle, background: pa.innings === n ? C.accent : C.surface, color: pa.innings === n ? "#fff" : C.textMuted, borderColor: pa.innings === n ? C.accent : C.border }}>{n}</button>)}
            </div>
            <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
              <label style={{ fontSize: 12, color: C.textMuted }}>Budget:</label>
              {ARM_CARE.budgetOptions.map(b => <button key={b} onClick={() => updatePitcher(pa.id, "budget", b)} style={{ ...miniChipStyle, background: pa.budget === b ? C.blue : C.surface, color: pa.budget === b ? "#fff" : C.textMuted, borderColor: pa.budget === b ? C.blue : C.border, fontSize: 11 }}>{b}</button>)}
            </div>
            {avail && (
              <span style={{
                fontSize: 11, padding: "3px 8px", borderRadius: 12, fontWeight: 600,
                background: !avail.available ? C.redLight : avail.hasWarnings ? C.orangeLight : C.greenLight,
                color:      !avail.available ? C.redText  : avail.hasWarnings ? C.orange      : C.greenText,
              }}>{!avail.available ? "Unavailable" : avail.hasWarnings ? "Restricted" : "Available"}</span>
            )}
            <span style={{ fontSize: 11, color: C.textMuted }}>{"→"} {getRestLabel(pa.budget)} rest</span>
            <div style={{ display: "flex", gap: isMobile ? 6 : 4, alignItems: "center", marginLeft: "auto" }}>
              <button onClick={() => reorderPitcher(idx, idx - 1)} disabled={idx === 0} title="Move up"
                style={{ ...arrowBtnStyle, opacity: idx === 0 ? 0.3 : 1, cursor: idx === 0 ? "default" : "pointer" }}>{"↑"}</button>
              <button onClick={() => reorderPitcher(idx, idx + 1)} disabled={idx === pitcherAssignments.length - 1} title="Move down"
                style={{ ...arrowBtnStyle, opacity: idx === pitcherAssignments.length - 1 ? 0.3 : 1, cursor: idx === pitcherAssignments.length - 1 ? "default" : "pointer" }}>{"↓"}</button>
              <button onClick={() => removePitcher(pa.id)} title="Remove pitcher" style={removeBtnStyle}>&times;</button>
            </div>
            {avail && avail.warnings && avail.warnings.length > 0 && (
              <div style={{ flexBasis: "100%", display: "flex", flexDirection: "column", gap: 2, marginLeft: 32, marginTop: -4 }}>
                {avail.warnings.map((w, i) => (
                  <span key={i} style={{ fontSize: 11, color: C.orange, fontWeight: 500 }}>
                    <span style={{ marginRight: 4 }}>{"⚠"}</span>{w.msg}
                  </span>
                ))}
              </div>
            )}
          </div>
        );
      })}
      {(() => {
        const unassigned = (pitchEligible || []).filter(p => !pitcherAssignments.some(pa => pa.id === p.id));
        const available   = unassigned.filter(p => pitcherAvailability?.[p.id]?.available !== false);
        const unavailable = unassigned.filter(p => pitcherAvailability?.[p.id]?.available === false);
        return (
          <React.Fragment>
            <div style={{ marginTop: 14 }}>
              <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 8, fontWeight: 500 }}>Available arms:</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {available.length === 0 && (
                  <span style={{ fontSize: 12, color: C.textLight, fontStyle: "italic" }}>None — all eligible pitchers are already assigned or resting.</span>
                )}
                {available.map(p => {
                  const avail = pitcherAvailability?.[p.id];
                  const hasWarn = !!avail?.hasWarnings;
                  const tip = avail?.warnings?.length > 0 ? avail.warnings.map(w => w.msg).join(" · ") : avail?.reason;
                  return <button key={p.id} onClick={() => addPitcher(p.id)} title={tip || ""} style={{
                      ...chipStyle, padding: "6px 12px",
                      background:  hasWarn ? C.orangeLight : C.greenLight,
                      borderColor: hasWarn ? C.orange      : C.green,
                      color:       hasWarn ? C.orange      : C.greenText,
                    }}>
                    {hasWarn && <span style={{ marginRight: 4 }}>{"⚠"}</span>}{p.name}
                  </button>;
                })}
              </div>
            </div>
            {unavailable.length > 0 && (
              <div style={{ marginTop: 14 }}>
                <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 8, fontWeight: 500 }}>Unavailable:</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                  {unavailable.map(p => {
                    const avail = pitcherAvailability?.[p.id];
                    return <button key={p.id} disabled title={avail?.reason || "Unavailable"} style={{
                        ...chipStyle, padding: "6px 12px",
                        opacity: 0.5, cursor: "not-allowed",
                        background: C.redLight, borderColor: C.red, color: C.redText,
                      }}>
                      {p.name}
                    </button>;
                  })}
                </div>
              </div>
            )}
          </React.Fragment>
        );
      })()}
    </Section>
  );
}

// CATCHING PLAN
// Companion to PitchingPlan. Same usage pattern: pass assignments + setter.
// ══════════════════════════════════════════════════
function CatchingPlan({ roster, catcherAssignments, setCatcherAssignments, catchEligible, gameInnings, defaultOpen = true }) {
  const isMobile = useIsMobile();
  const totalInnings = catcherAssignments.reduce((s, c) => s + (c.innings || 0), 0);
  const removeBtnStyle = {
    ...miniChipStyle, color: C.red, borderColor: C.red, marginLeft: "auto",
    padding: isMobile ? "8px 14px" : undefined,
    fontSize: isMobile ? 16 : undefined,
    minWidth: isMobile ? 44 : 0,
    minHeight: isMobile ? 36 : 0,
    lineHeight: 1,
  };
  const addCatcher = (id) => { if (!catcherAssignments.some(c => c.id === id)) setCatcherAssignments(prev => [...prev, { id, innings: 3 }]); };
  const removeCatcher = (id) => setCatcherAssignments(prev => prev.filter(c => c.id !== id));
  const updateCatcher = (id, field, value) => setCatcherAssignments(prev => prev.map(c => c.id === id ? { ...c, [field]: value } : c));

  return (
    <Section title={`Catching Plan (${totalInnings}/${gameInnings} inn)`} defaultOpen={defaultOpen} alert={totalInnings < gameInnings ? `Need ${gameInnings - totalInnings} more innings` : null} success={totalInnings >= gameInnings}>
      {catcherAssignments.map((ca, idx) => {
        const player = roster.find(p => p.id === ca.id);
        return (
          <div key={ca.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: `1px solid ${C.borderLight}` }}>
            <span style={{ color: C.accent, fontWeight: 700, width: 22, textAlign: "center", fontSize: 14 }}>{idx + 1}</span>
            <span style={{ fontWeight: 600, minWidth: 80, fontSize: 14 }}>{player?.name}</span>
            <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
              <label style={{ fontSize: 12, color: C.textMuted }}>Inn:</label>
              {[1,2,3,4,5,6].map(n => <button key={n} onClick={() => updateCatcher(ca.id, "innings", n)} style={{ ...miniChipStyle, background: ca.innings === n ? C.accent : C.surface, color: ca.innings === n ? "#fff" : C.textMuted, borderColor: ca.innings === n ? C.accent : C.border }}>{n}</button>)}
            </div>
            <button onClick={() => removeCatcher(ca.id)} title="Remove catcher" style={removeBtnStyle}>&times;</button>
          </div>
        );
      })}
      <div style={{ marginTop: 14 }}>
        <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 8, fontWeight: 500 }}>Available catchers:</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {(catchEligible || [])
            .filter(p => !catcherAssignments.some(ca => ca.id === p.id))
            .slice()
            .sort((a, b) => (TIER_SCORE[playerTier(b, "C")] || 0) - (TIER_SCORE[playerTier(a, "C")] || 0))
            .map(p => {
              const tier = playerTier(p, "C");
              return <button key={p.id} onClick={() => addCatcher(p.id)} style={{ ...chipStyle, padding: "6px 12px", background: C.surface, borderColor: TIER_COLORS[tier] || C.border }}>
                <span style={{ display: "inline-block", width: 7, height: 7, borderRadius: "50%", background: TIER_COLORS[tier] || C.textLight, marginRight: 6 }} />
                {p.name}
              </button>;
          })}
        </div>
      </div>
    </Section>
  );
}

// ══════════════════════════════════════════════════
// EDIT PLAN MODAL
// In-flight pitching/catching tweak from the Lineup Editor. Drafts the
// changes locally so Cancel discards cleanly, then on Save the App-level
// state gets replaced and the lineup is regenerated from scratch.
// ══════════════════════════════════════════════════
function EditPlanModal({ open, onClose, roster, currentPitchers, currentCatchers, pitcherAvailability, pitchEligible, catchEligible, gameInnings, onSaveAndRegenerate }) {
  if (!open) return null;
  return (
    <EditPlanModalInner
      onClose={onClose}
      roster={roster}
      currentPitchers={currentPitchers}
      currentCatchers={currentCatchers}
      pitcherAvailability={pitcherAvailability}
      pitchEligible={pitchEligible}
      catchEligible={catchEligible}
      gameInnings={gameInnings}
      onSaveAndRegenerate={onSaveAndRegenerate}
    />
  );
}

function EditPlanModalInner({ onClose, roster, currentPitchers, currentCatchers, pitcherAvailability, pitchEligible, catchEligible, gameInnings, onSaveAndRegenerate }) {
  // Drafts initialise from a deep copy so edits don't leak back to App state
  // until Save & Regenerate fires. Using useState with the prop as the
  // initializer means each fresh mount of the modal starts from the latest
  // App state.
  const [draftPitchers, setDraftPitchers] = useState(() => JSON.parse(JSON.stringify(currentPitchers || [])));
  const [draftCatchers, setDraftCatchers] = useState(() => JSON.parse(JSON.stringify(currentCatchers || [])));

  const totalP = draftPitchers.reduce((s, p) => s + (p.innings || 0), 0);
  const totalC = draftCatchers.reduce((s, c) => s + (c.innings || 0), 0);
  const enoughInnings = totalP >= gameInnings && totalC >= gameInnings && draftPitchers.length > 0 && draftCatchers.length > 0;

  const handleSave = () => {
    if (!enoughInnings) return;
    onSaveAndRegenerate(draftPitchers, draftCatchers);
  };

  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)",
      display: "flex", alignItems: "flex-start", justifyContent: "center",
      padding: "30px 16px 20px", zIndex: 1000,
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: C.surface, color: C.text, borderRadius: 8, padding: 20,
        maxWidth: 720, width: "100%", maxHeight: "calc(100vh - 60px)", overflowY: "auto",
        boxShadow: "0 8px 32px rgba(0,0,0,0.2)",
      }}>
        <div style={{ display: "flex", alignItems: "center", marginBottom: 14 }}>
          <span style={{ fontFamily: DISPLAY, fontSize: 18, fontWeight: 700, color: C.text }}>Edit pitching &amp; catching</span>
          <button onClick={onClose} title="Cancel" style={{
            marginLeft: "auto", background: "transparent", border: "none",
            color: C.textMuted, cursor: "pointer", fontSize: 20, lineHeight: 1, padding: "4px 8px",
          }}>{"×"}</button>
        </div>

        <div style={{ fontSize: 12, color: C.textMuted, lineHeight: 1.5, marginBottom: 16, padding: "10px 12px", background: C.surfaceAlt, borderRadius: 6, border: `1px solid ${C.borderLight}` }}>
          <strong>Save &amp; Regenerate</strong> rebuilds the position grid from these assignments. Any manual swaps you've made on the lineup will be replaced.
        </div>

        <PitchingPlan
          roster={roster}
          pitcherAssignments={draftPitchers}
          setPitcherAssignments={setDraftPitchers}
          pitcherAvailability={pitcherAvailability}
          pitchEligible={pitchEligible}
          gameInnings={gameInnings}
          defaultOpen={true}
        />

        <CatchingPlan
          roster={roster}
          catcherAssignments={draftCatchers}
          setCatcherAssignments={setDraftCatchers}
          catchEligible={catchEligible}
          gameInnings={gameInnings}
          defaultOpen={true}
        />

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 18, paddingTop: 14, borderTop: `1px solid ${C.borderLight}` }}>
          <button onClick={onClose} style={{
            background: C.surface, border: `1px solid ${C.border}`, color: C.text,
            padding: "10px 20px", borderRadius: 6, fontFamily: FONT, fontSize: 13, fontWeight: 500, cursor: "pointer",
          }}>Cancel</button>
          <button onClick={handleSave} disabled={!enoughInnings} title={enoughInnings ? "" : "Need enough innings on both pitching and catching plans"} style={{
            background: enoughInnings ? C.accent : C.surfaceAlt,
            border: `1px solid ${enoughInnings ? C.accent : C.border}`,
            color: enoughInnings ? "#fff" : C.textLight,
            padding: "10px 22px", borderRadius: 6, fontFamily: FONT, fontSize: 13, fontWeight: 600,
            cursor: enoughInnings ? "pointer" : "not-allowed",
          }}>Save &amp; Regenerate</button>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════
// SETUP TAB (no CF restriction)
// ══════════════════════════════════════════════════
function SetupTab({ roster, setRoster, availablePlayers, absentIds, setAbsentIds, pitcherAssignments, setPitcherAssignments, catcherAssignments, setCatcherAssignments, benchTiers, setBenchTiers, pitcherAvailability, gameInnings, setGameInnings, gameMeta, setGameMeta, onGenerate }) {
  // On phone, the heavier planning sections start collapsed so the page
  // doesn't open as one long scroll. Tap a section title to expand.
  const isMobile = useIsMobile();
  const updateMeta = (field, value) => setGameMeta(prev => ({ ...prev, [field]: value }));
  const toggleAbsent = (id) => {
    setAbsentIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
    setPitcherAssignments(prev => prev.filter(p => p.id !== id));
    setCatcherAssignments(prev => prev.filter(c => c.id !== id));
  };
  const pitchEligible = availablePlayers.filter(p => p.positionMap?.P);
  const catchEligible = availablePlayers.filter(p => playerCanPlay(p, "C") && !pitcherAssignments.some(pa => pa.id === p.id));
  // The pitcher/catcher mutation helpers + drag state now live inside the
  // shared <PitchingPlan> / <CatchingPlan> components; SetupTab only needs
  // the totals below for the Generate-button gate.
  const totalPitcherInnings = pitcherAssignments.reduce((s, p) => s + p.innings, 0);
  const totalCatcherInnings = catcherAssignments.reduce((s, c) => s + c.innings, 0);
  const canGenerate = pitcherAssignments.length > 0 && catcherAssignments.length > 0 && totalPitcherInnings >= gameInnings && totalCatcherInnings >= gameInnings && availablePlayers.length >= 9;
  // Generating a lineup can auto-create a schedule entry and is what other
  // coaches will see — gated the same way as the other "goes live" actions.
  const [generateGateOpen, setGenerateGateOpen] = useState(false);

  return (
    <div>
      <Section title="Game Details" defaultOpen>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 16, alignItems: "flex-end" }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            <label style={{ fontSize: 12, color: C.textMuted, fontWeight: 500 }}>Date</label>
            <input type="date" value={gameMeta.date || ""} onChange={e => updateMeta("date", e.target.value)}
              style={{ fontFamily: FONT, fontSize: 13, padding: "6px 10px", border: `1px solid ${C.border}`, borderRadius: 6, background: C.surface, color: C.text }} />
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            <label style={{ fontSize: 12, color: C.textMuted, fontWeight: 500 }}>Time (optional)</label>
            <input type="time" value={gameMeta.time || ""} onChange={e => updateMeta("time", e.target.value)}
              style={{ fontFamily: FONT, fontSize: 13, padding: "6px 10px", border: `1px solid ${C.border}`, borderRadius: 6, background: C.surface, color: C.text }} />
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 4, flex: 1, minWidth: 180 }}>
            <label style={{ fontSize: 12, color: C.textMuted, fontWeight: 500 }}>Opponent</label>
            <input type="text" value={gameMeta.opponent || ""} onChange={e => updateMeta("opponent", e.target.value)} placeholder="e.g. Burlington Bulls"
              style={{ fontFamily: FONT, fontSize: 13, padding: "6px 10px", border: `1px solid ${C.border}`, borderRadius: 6, background: C.surface, color: C.text }} />
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 4, flexBasis: "100%" }}>
            <label style={{ fontSize: 12, color: C.textMuted, fontWeight: 500 }}>Home / Away</label>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {[{id:"home", label:"Home (vs)"}, {id:"away", label:"Away (@)"}].map(opt => (
                <button key={opt.id} onClick={() => updateMeta("homeAway", opt.id)}
                  style={{ ...chipStyle, background: (gameMeta.homeAway || "home") === opt.id ? C.accent : C.surface, color: (gameMeta.homeAway || "home") === opt.id ? "#fff" : C.text, borderColor: (gameMeta.homeAway || "home") === opt.id ? C.accent : C.border, padding: "6px 14px" }}>
                  {opt.label}
                </button>
              ))}
            </div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 4, flexBasis: "100%" }}>
            <label style={{ fontSize: 12, color: C.textMuted, fontWeight: 500 }}>Game Type</label>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {GAME_TYPES.map(gt => (
                <button key={gt.id} onClick={() => updateMeta("gameType", gt.id)}
                  style={{ ...chipStyle, background: gameMeta.gameType === gt.id ? C.accent : C.surface, color: gameMeta.gameType === gt.id ? "#fff" : C.text, borderColor: gameMeta.gameType === gt.id ? C.accent : C.border, padding: "6px 14px" }}>
                  {gt.label}
                </button>
              ))}
            </div>
          </div>
        </div>
      </Section>

      <Section title="Game Length" defaultOpen>
        <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
          <label style={{ fontSize: 13, color: C.textMuted, fontWeight: 500 }}>Innings:</label>
          {[4,5,6,7].map(n => (
            <button key={n} onClick={() => setGameInnings(n)} style={{ ...chipStyle, background: gameInnings === n ? C.accent : C.surface, color: gameInnings === n ? "#fff" : C.text, borderColor: gameInnings === n ? C.accent : C.border, padding: "6px 14px" }}>{n}</button>
          ))}
          <div style={{ marginLeft: "auto", fontSize: 13, color: C.textMuted }}>{availablePlayers.length} players available</div>
        </div>
      </Section>

      <Section title={`Attendance (${availablePlayers.length}/${roster.length})`}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {roster.map(p => {
            const absent = absentIds.includes(p.id);
            return <button key={p.id} onClick={() => toggleAbsent(p.id)} style={{ ...chipStyle, padding: "7px 14px", background: absent ? C.redLight : C.surface, color: absent ? C.redText : C.text, borderColor: absent ? C.red : C.border, textDecoration: absent ? "line-through" : "none", opacity: absent ? 0.7 : 1 }}>#{p.number} {p.name}</button>;
          })}
        </div>
        <div style={{ fontSize: 12, color: C.textLight, marginTop: 10, fontStyle: "italic" }}>Tap a player to mark them absent</div>
      </Section>

      <PitchingPlan
        roster={roster}
        pitcherAssignments={pitcherAssignments}
        setPitcherAssignments={setPitcherAssignments}
        pitcherAvailability={pitcherAvailability}
        pitchEligible={pitchEligible}
        gameInnings={gameInnings}
        defaultOpen={!isMobile}
      />

      <CatchingPlan
        roster={roster}
        catcherAssignments={catcherAssignments}
        setCatcherAssignments={setCatcherAssignments}
        catchEligible={catchEligible}
        gameInnings={gameInnings}
        defaultOpen={!isMobile}
      />

      {/* Roster Priority \u2014 same combined editor that lives on the Team
          Reports tab. Rendered top-level (not inside a Section) so it's
          visually identical in both places, per the "match exactly" spec. */}
      <div style={{ marginTop: 14, marginBottom: 14 }}>
        <PriorityMatrix roster={roster} setRoster={setRoster} benchTiers={benchTiers} setBenchTiers={setBenchTiers} />
      </div>

      <div style={{ marginTop: 28, textAlign: "center" }}>
        <button onClick={() => setGenerateGateOpen(true)} disabled={!canGenerate} style={{
          background: canGenerate ? C.accent : C.surfaceAlt, color: canGenerate ? "#fff" : C.textLight,
          border: canGenerate ? "none" : `1px solid ${C.border}`, padding: "14px 48px", borderRadius: 8,
          fontFamily: FONT, fontSize: 16, fontWeight: 600, cursor: canGenerate ? "pointer" : "not-allowed",
          boxShadow: canGenerate ? "0 4px 14px rgba(107,127,94,0.3)" : "none",
        }}>Generate Lineup</button>
        <EditGate
          open={generateGateOpen}
          onClose={() => setGenerateGateOpen(false)}
          onConfirmed={onGenerate}
          actionLabel="Generating this lineup"
        />
        {!canGenerate && (
          <div style={{ fontSize: 13, color: C.red, marginTop: 10 }}>
            {availablePlayers.length < 9 && "Need at least 9 available players. "}
            {pitcherAssignments.length === 0 && "Select at least one pitcher. "}
            {catcherAssignments.length === 0 && "Select at least one catcher. "}
            {totalPitcherInnings < gameInnings && `Pitching plan covers ${totalPitcherInnings}/${gameInnings} innings. `}
            {totalCatcherInnings < gameInnings && `Catching plan covers ${totalCatcherInnings}/${gameInnings} innings. `}
          </div>
        )}
      </div>
    </div>
  );
}
