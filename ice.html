// Live "is this a phone-sized viewport" flag, used to set sensible defaults
// (collapsed sections, vertical action stacks). Updates on resize/rotate.
function useIsMobile(breakpoint = 768) {
  const [isMobile, setIsMobile] = useState(() =>
    typeof window !== "undefined" && window.innerWidth <= breakpoint
  );
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth <= breakpoint);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, [breakpoint]);
  return isMobile;
}

// TIME HELPERS
// Everything internal is "minutes since midnight" (an integer). Strings are
// only for storage ("HH:MM", 24h) and display ("5:30p").
// ══════════════════════════════════════════════════
const STEP = 15;              // scheduling granularity, in minutes
const MIN_USEFUL_BLOCK = 50;  // a free gap shorter than this is wasted ice

function toMin(hhmm) {
  if (typeof hhmm === "number") return hhmm;
  if (!hhmm) return 0;
  const [h, m] = String(hhmm).split(":").map(Number);
  return (h || 0) * 60 + (m || 0);
}
function toHHMM(min) {
  const m = Math.max(0, Math.round(min));
  return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
}
function fmtTime(min) {
  const m = toMin(min);
  let h = Math.floor(m / 60), mm = m % 60;
  const suffix = h >= 12 ? "p" : "a";
  h = h % 12 === 0 ? 12 : h % 12;
  return mm === 0 ? `${h}${suffix}` : `${h}:${String(mm).padStart(2, "0")}${suffix}`;
}
function fmtRange(startMin, endMin) {
  return `${fmtTime(startMin)}–${fmtTime(endMin)}`;
}
function fmtDur(min) {
  const h = Math.floor(min / 60), m = min % 60;
  if (h && m) return `${h}h ${m}m`;
  if (h) return `${h}h`;
  return `${m}m`;
}
// Date strings are "YYYY-MM-DD" and always parsed as local noon so DST and
// timezone offsets can never shift the calendar day.
function parseDate(ds) {
  const [y, m, d] = ds.split("-").map(Number);
  return new Date(y, m - 1, d, 12, 0, 0, 0);
}
function dateStr(dt) {
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
}
function addDays(ds, n) {
  const dt = parseDate(ds);
  dt.setDate(dt.getDate() + n);
  return dateStr(dt);
}
function dowOf(ds) { return parseDate(ds).getDay(); }        // 0 = Sunday
function isWeekend(ds) { const d = dowOf(ds); return d === 0 || d === 6; }
function dayTypeOf(ds) { return isWeekend(ds) ? "weekend" : "weekday"; }
const DOW_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOW_LONG  = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function fmtDate(ds) {
  const dt = parseDate(ds);
  return `${DOW_SHORT[dt.getDay()]} ${MONTHS[dt.getMonth()].slice(0, 3)} ${dt.getDate()}`;
}
function fmtDateLong(ds) {
  const dt = parseDate(ds);
  return `${DOW_LONG[dt.getDay()]}, ${MONTHS[dt.getMonth()]} ${dt.getDate()}`;
}
// Monday-anchored week start — associations plan ice Mon-to-Sun.
function weekStartOf(ds) {
  const d = dowOf(ds);
  return addDays(ds, d === 0 ? -6 : 1 - d);
}
function weekLabel(ws) {
  return `${fmtDate(ws).replace(/^\w+ /, "")} – ${fmtDate(addDays(ws, 6)).replace(/^\w+ /, "")}`;

function overlaps(aStart, aEnd, bStart, bEnd) {

  const now = new Date();
  const i = SEASON_MONTHS.findIndex(m => m.y === now.getFullYear() && m.m === now.getMonth());

function buildSeedSlots(weeks = 4) {
  const out = [];
  for (let w = 0; w < weeks; w++) {
    for (let d = 0; d < 7; d++) {
      const ds = addDays(SEASON_START, w * 7 + d);
      const dow = dowOf(ds);
      for (const p of SEED_PATTERN) {
        if (!p.dows.includes(dow)) continue;
        out.push({
          id: uid("slot"),
          rinkId: p.rinkId,
          date: ds,
          start: p.start,
          end: p.end,
          note: "",
        });
      }
    }
  }
  return out;

// ══════════════════════════════════════════════════
// PERSISTENCE
// localStorage is always the working store. If the optional `ice_data`
// table exists in Supabase we also mirror every write there and hydrate
// from it on load, which is what makes the schedule shared. If it doesn't
// exist (or the network is down) `cloudReady` stays false and the app runs
// local-only — no error, just a "Local only" badge in the header.
// ══════════════════════════════════════════════════
const KEY_TO_COLUMN = {
  "ice_rinks":       "rinks",
  "ice_teams":       "teams",
  "ice_slots":       "slots",
  "ice_assignments": "assignments",
  "ice_rules":       "age_rules",
  "ice_meta":        "meta",
};
const cloudCache = {};
let cloudReady = false;
let cloudChecked = false;

async function hydrateFromCloud() {
  if (!supabase) { cloudChecked = true; return { ok: false, reason: "Supabase SDK unavailable" }; }
  try {
    const { data, error } = await supabase.from("ice_data").select("*").eq("id", 1).maybeSingle();
    if (error) return { ok: false, reason: error.message };
    if (!data) return { ok: false, reason: "no row" };
    for (const [key, column] of Object.entries(KEY_TO_COLUMN)) {
      if (data[column] != null) cloudCache[key] = data[column];
    }
    cloudReady = true;
    return { ok: true };
  } catch (e) {
    return { ok: false, reason: e?.message || String(e) };
  } finally {
    cloudChecked = true;
  }
}

async function pushToCloud(key, value) {
  const column = KEY_TO_COLUMN[key];
  if (!column || !cloudReady) return { ok: true, skipped: true };
  try {
    const { error } = await supabase.from("ice_data").update({ [column]: value }).eq("id", 1);
    if (error) return { ok: false, reason: error.message };
    return { ok: true };
  } catch (e) {
    return { ok: false, reason: e?.message || String(e) };
  }
}

// Set by App so the save layer can surface cloud write failures in the UI
// without every caller having to thread a callback through.
let onCloudResult = () => {};

function load(k, fb) {
  if (cloudReady && cloudCache[k] !== undefined) return cloudCache[k];
  try {
    const raw = localStorage.getItem(k);
    return raw ? JSON.parse(raw) : fb;
  } catch { return fb; }
}

function save(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
  if (cloudReady) {
    cloudCache[k] = v;
    pushToCloud(k, v).then(r => {
      if (!r.ok) onCloudResult({ ok: false, message: r.reason });
      else if (!r.skipped) onCloudResult({ ok: true });
    });
  }
}

// ══════════════════════════════════════════════════
// RULE ACCESS
// Rules are stored keyed by age group. `windowFor` resolves the right
// weekday/weekend window and returns everything in minutes so the solver
// never has to think about strings.
// ══════════════════════════════════════════════════
function ruleFor(rules, ageGroup) {
  return rules[ageGroup] || DEFAULT_RULES[ageGroup] || DEFAULT_RULES.u11;
}
function windowFor(rules, ageGroup, ds) {
  const r = ruleFor(rules, ageGroup);
  const w = r[dayTypeOf(ds)] || r.weekday;
  return {
    earliest: toMin(w.earliest),
    latest: toMin(w.latest),
    duration: r.durationMin,
    allowShared: !!r.allowShared,
    maxPerDay: r.maxPerDay ?? 1,
    maxPerWeek: r.maxPerWeek ?? 4,
  };
}
// How much room a team has to be placed on a given day, in minutes. Used to
// order the solver's work: the team with the least slack goes first.
function windowWidth(rules, ageGroup, ds) {
  const w = windowFor(rules, ageGroup, ds);
  return Math.max(0, w.latest - w.earliest);
}

// ══════════════════════════════════════════════════
// SCHEDULING ENGINE
//
// The shape of the problem: a set of *slots* (blocks of ice an association
// has purchased at a rink on a date) and a set of *requests* (team X needs
// N ice times this week). A request can be satisfied anywhere inside a slot
// as long as the whole ice time fits, starts inside the team's age-band
// window, and doesn't collide with anything already booked.
//
// The solver is greedy-with-restarts, the same approach the lineup app uses
// for defensive positions: order the requests hardest-first, place each one
// at its lowest-cost feasible spot with a little random jitter so repeated
// runs explore different orderings, score the finished schedule, and keep
// the best of N runs.
// ══════════════════════════════════════════════════

// Everything the solver and the validator need, derived once per call.
function buildContext({ teams, rinks, slots, rules }) {
  return {
    teamMap: Object.fromEntries(teams.map(t => [t.id, t])),
    rinkMap: Object.fromEntries(rinks.map(r => [r.id, r])),
    slotMap: Object.fromEntries(slots.map(s => [s.id, s])),
    rules,
  };
}

// All assignments that live inside a given slot, sorted by start time.
function assignmentsInSlot(assignments, slotId) {
  return assignments
    .filter(a => a.slotId === slotId)
    .sort((a, b) => toMin(a.start) - toMin(b.start));
}

// Free intervals remaining in a slot, as [{start,end}] in minutes.
function freeSegments(slot, assignments) {
  const busy = assignmentsInSlot(assignments, slot.id)
    .map(a => ({ s: toMin(a.start), e: toMin(a.end) }));
  const out = [];
  let cursor = toMin(slot.start);
  const slotEnd = toMin(slot.end);
  for (const b of busy) {
    if (b.s > cursor) out.push({ start: cursor, end: Math.min(b.s, slotEnd) });
    cursor = Math.max(cursor, b.e);
  }
  if (cursor < slotEnd) out.push({ start: cursor, end: slotEnd });
  return out.filter(seg => seg.end > seg.start);
}

// Minutes of a slot that are booked / free / stranded (free but too short
// for anyone to use).
function slotUtilization(slot, assignments) {
  const total = toMin(slot.end) - toMin(slot.start);
  const free = freeSegments(slot, assignments);
  const freeMin = free.reduce((n, s) => n + (s.end - s.start), 0);
  const stranded = free.reduce((n, s) => n + (s.end - s.start < MIN_USEFUL_BLOCK ? s.end - s.start : 0), 0);
  return { total, booked: total - freeMin, free: freeMin, stranded, segments: free };
}

// Does this team already have ice that overlaps [start,end) on this date?
function teamBusy(assignments, teamId, ds, start, end, ignoreId) {
  return assignments.some(a =>
    a.id !== ignoreId &&
    a.date === ds &&
    (a.teamIds || []).includes(teamId) &&
    overlaps(toMin(a.start), toMin(a.end), start, end)
  );
}
function teamSessionsOnDate(assignments, teamId, ds) {
  return assignments.filter(a => a.date === ds && (a.teamIds || []).includes(teamId)).length;
}
function teamSessions(assignments, teamId) {
  return assignments.filter(a => (a.teamIds || []).includes(teamId));
}

// Every legal placement for one team inside the given slots. `mode` is
// "new" for a fresh ice time carved out of free space, or "join" for
// sharing an existing ice time with another team (half-ice / cross-ice for
// the youngest bands).
function candidatePlacements({ team, slots, assignments, rules, dates }) {
  const out = [];
  const blackoutDows = team.blackoutDows || [];
  const blackoutDates = team.blackoutDates || [];

  for (const slot of slots) {
    if (dates && !dates.includes(slot.date)) continue;
    if (slot.blocked) continue;   // tournament / public skate / maintenance
    if (blackoutDows.includes(dowOf(slot.date))) continue;
    if (blackoutDates.includes(slot.date)) continue;

    const w = windowFor(rules, team.ageGroup, slot.date);
    const slotStart = toMin(slot.start), slotEnd = toMin(slot.end);

    // ── Sharing: join an existing ice time of exactly the same length,
    // when both bands allow it and the ice time still has room.
    if (w.allowShared) {
      for (const a of assignmentsInSlot(assignments, slot.id)) {
        if ((a.teamIds || []).length >= 2) continue;
        if (toMin(a.end) - toMin(a.start) !== w.duration) continue;
        const other = a.teamIds?.[0];
        if (!other) continue;
        const start = toMin(a.start);
        if (start < Math.max(slotStart, w.earliest) || start > w.latest) continue;
        if (teamBusy(assignments, team.id, slot.date, start, start + w.duration)) continue;
        out.push({ mode: "join", joinId: a.id, slotId: slot.id, rinkId: slot.rinkId, date: slot.date, start, end: start + w.duration, otherTeamId: other });
      }
    }

    // ── Fresh placements inside each free segment of the slot.
    for (const seg of freeSegments(slot, assignments)) {
      const lo = Math.max(seg.start, w.earliest);
      const hi = Math.min(seg.end - w.duration, w.latest);
      if (hi < lo) continue;
      // Align to the STEP grid, but always include the two placements that
      // waste nothing: flush to the start of the segment and flush to its
      // end. Those are the ones that keep ice from getting stranded.
      const starts = new Set();
      if (lo % STEP === 0) starts.add(lo);
      for (let t = Math.ceil(lo / STEP) * STEP; t <= hi; t += STEP) starts.add(t);
      starts.add(lo);
      const flushEnd = seg.end - w.duration;
      if (flushEnd >= lo && flushEnd <= hi) starts.add(flushEnd);
      for (const start of starts) {
        if (start < lo || start > hi) continue;
        if (teamBusy(assignments, team.id, slot.date, start, start + w.duration)) continue;
        out.push({ mode: "new", slotId: slot.id, rinkId: slot.rinkId, date: slot.date, start, end: start + w.duration, segEnd: seg.end, segStart: seg.start });
      }
    }
  }
  return out;
}

// Cost of a placement, lower is better. The terms, roughly in order of how
// much they matter:
//   • stranded ice — a placement that leaves an unusable sliver behind is
//     the single most expensive mistake a scheduler can make
//   • fairness — teams that already hold prime ice pay to take more; teams
//     already stuck with off-peak ice get a discount on prime
//   • spacing — two ice times in a day is bad, back-to-back days is meh
//   • home rink and packing preferences are tie-breakers
function placementCost(p, { team, state, rules }) {
  let cost = 0;
  const quality = slotQuality(p.date, p.start);

  if (p.mode === "join") {
    // Sharing costs nothing extra and consumes no new ice — reward it.
    cost -= 4;
  } else {
    // Stranding: what's left of this free segment once we take our bite.
    const before = p.start - p.segStart;
    const after = p.segEnd - p.end;
    for (const gap of [before, after]) {
      if (gap === 0) continue;
      if (gap < MIN_USEFUL_BLOCK) cost += 0.06 * gap;  // dead ice, priced per minute
      else cost += 0.004 * gap;                        // usable, mild packing bias
    }
  }

  // Fairness: compare this team's holdings against the association average
  // so far. `state.primeCount` / `state.roughCount` are running totals.
  const primeAvg = state.primeAvg || 0;
  const roughAvg = state.roughAvg || 0;
  const myPrime = state.primeCount[team.id] || 0;
  const myRough = state.roughCount[team.id] || 0;
  if (quality === "prime") cost += 2.5 * Math.max(0, myPrime - primeAvg);
  if (quality === "rough") cost += 2.5 * Math.max(0, myRough - roughAvg) + 1.2;

  // Younger bands lose the room badly on late ice; the window already
  // enforces the hard limit, but bias them toward the front of it.
  const w = windowFor(rules, team.ageGroup, p.date);
  const windowSpan = Math.max(1, w.latest - w.earliest);
  const posInWindow = (p.start - w.earliest) / windowSpan;
  cost += 0.8 * posInWindow;

  // Spacing.
  const sameDay = teamSessionsOnDate(state.assignments, team.id, p.date);
  if (sameDay > 0) cost += 6;
  const w2 = windowFor(rules, team.ageGroup, p.date);
  if (sameDay >= w2.maxPerDay) cost += 12;
  if (teamSessionsOnDate(state.assignments, team.id, addDays(p.date, -1)) > 0) cost += 1.2;
  if (teamSessionsOnDate(state.assignments, team.id, addDays(p.date, 1)) > 0) cost += 1.2;

  // Rink familiarity.
  if (team.homeRinkId && p.rinkId !== team.homeRinkId) cost += 0.9;

  return cost;
}

// One greedy pass. `seed` drives the jitter so runs differ.
function solveOnce({ teams, slots, rules, requests, locked, rand }) {
  const assignments = locked.map(a => ({ ...a, teamIds: [...(a.teamIds || [])] }));
  const primeCount = {}, roughCount = {};
  for (const t of teams) { primeCount[t.id] = 0; roughCount[t.id] = 0; }
  for (const a of assignments) {
    const q = slotQuality(a.date, toMin(a.start));
    for (const tid of a.teamIds || []) {
      if (q === "prime") primeCount[tid] = (primeCount[tid] || 0) + 1;
      if (q === "rough") roughCount[tid] = (roughCount[tid] || 0) + 1;
    }
  }

  const unplaced = [];
  const state = { assignments, primeCount, roughCount, primeAvg: 0, roughAvg: 0 };

  // Hardest-first: the team whose age band has the narrowest start window
  // has the fewest places to go, so it picks before anyone else. Ties are
  // broken by remaining need, then randomly.
  const queue = requests.map((r, i) => ({ ...r, _i: i }));
  const tightness = {};
  for (const t of teams) {
    tightness[t.id] = mean([1,2,3,4,5,6,0].map(d => windowWidth(rules, t.ageGroup, addDays(SEASON_START, d))));
  }

  let remaining = queue.slice();
  while (remaining.length) {
    remaining.sort((a, b) => {
      const ta = tightness[a.teamId] ?? 999, tb = tightness[b.teamId] ?? 999;
      if (ta !== tb) return ta - tb;
      return a._i - b._i;
    });
    // Take the tightest request, but jitter which of the equally-tight ones
    // goes first so restarts actually explore.
    const headTight = tightness[remaining[0].teamId] ?? 999;
    const tied = remaining.filter(r => (tightness[r.teamId] ?? 999) === headTight);
    const req = tied[Math.floor(rand() * tied.length)];
    remaining = remaining.filter(r => r !== req);

    const team = teams.find(t => t.id === req.teamId);
    if (!team) continue;

    state.primeAvg = mean(Object.values(primeCount));
    state.roughAvg = mean(Object.values(roughCount));

    const cands = candidatePlacements({ team, slots, assignments, rules, dates: req.dates });
    if (!cands.length) { unplaced.push({ ...req, reason: "no open ice inside this team's start window" }); continue; }

    let best = null, bestCost = Infinity;
    for (const p of cands) {
      const c = placementCost(p, { team, state, rules }) + rand() * 0.9;
      if (c < bestCost) { bestCost = c; best = p; }
    }
    if (!best) { unplaced.push({ ...req, reason: "no legal placement" }); continue; }

    if (best.mode === "join") {
      const target = assignments.find(a => a.id === best.joinId);
      target.teamIds = [...target.teamIds, team.id];
      target.shared = true;
    } else {
      assignments.push({
        id: uid("ice"),
        slotId: best.slotId,
        rinkId: best.rinkId,
        date: best.date,
        start: toHHMM(best.start),
        end: toHHMM(best.end),
        teamIds: [team.id],
        kind: req.kind || "practice",
        locked: false,
        shared: false,
      });
    }
    const q = slotQuality(best.date, best.start);
    if (q === "prime") primeCount[team.id] = (primeCount[team.id] || 0) + 1;
    if (q === "rough") roughCount[team.id] = (roughCount[team.id] || 0) + 1;
  }

  return { assignments, unplaced, primeCount, roughCount };
}

// Whole-schedule score. Lower is better; unplaced requests dominate.
function scoreSolution(sol, { slots, teams }) {
  let score = sol.unplaced.length * 1000;

  // Stranded ice across every slot we touched.
  for (const slot of slots) {
    const u = slotUtilization(slot, sol.assignments);
    score += u.stranded * 0.4;
  }
  // Fairness: variance in prime and off-peak holdings.
  const primes = teams.map(t => sol.primeCount[t.id] || 0);
  const roughs = teams.map(t => sol.roughCount[t.id] || 0);
  const pm = mean(primes), rm = mean(roughs);
  score += mean(primes.map(v => (v - pm) ** 2)) * 8;
  score += mean(roughs.map(v => (v - rm) ** 2)) * 8;

  // Same-day doubling up.
  for (const t of teams) {
    const byDate = {};
    for (const a of teamSessions(sol.assignments, t.id)) byDate[a.date] = (byDate[a.date] || 0) + 1;
    for (const n of Object.values(byDate)) if (n > 1) score += (n - 1) * 15;
  }
  return score;
}

// Deterministic-ish PRNG so a given seed reproduces a given schedule.
function makeRand(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

// Public entry point. Returns the best of `runs` greedy attempts.
function solveSchedule({ teams, slots, rules, requests, locked = [], runs = 60, seed = 0 }) {
  let best = null, bestScore = Infinity;
  for (let i = 0; i < runs; i++) {
    const sol = solveOnce({ teams, slots, rules, requests, locked, rand: makeRand((seed + i) * 7919 + 13) });
    const score = scoreSolution(sol, { slots, teams });
    if (score < bestScore) { bestScore = score; best = sol; }
    if (bestScore === 0) break;
  }
  return { ...best, score: bestScore, runs };
}

// ══════════════════════════════════════════════════
// VALIDATION
// Same philosophy as the lineup app: warn, don't block. Anything the
// solver produced should come back clean; the point of this pass is to
// catch what hand-editing breaks afterwards. Severity drives the colour
// and the sort order, nothing else.
// ══════════════════════════════════════════════════
function validateSchedule({ assignments, teams, slots, rinks, rules, dates, requests }) {
  const issues = [];
  const add = (severity, message, extra = {}) => issues.push({ severity, message, ...extra });
  const teamMap = Object.fromEntries(teams.map(t => [t.id, t]));
  const rinkMap = Object.fromEntries(rinks.map(r => [r.id, r]));
  const slotMap = Object.fromEntries(slots.map(s => [s.id, s]));
  const inRange = dates ? assignments.filter(a => dates.includes(a.date)) : assignments;

  // ── Hard conflicts: same sheet of ice, two ice times.
  const byRinkDate = {};
  for (const a of inRange) {
    const k = `${a.rinkId}|${a.date}`;
    (byRinkDate[k] = byRinkDate[k] || []).push(a);
  }
  for (const [k, list] of Object.entries(byRinkDate)) {
    const sorted = [...list].sort((x, y) => toMin(x.start) - toMin(y.start));
    for (let i = 1; i < sorted.length; i++) {
      const prev = sorted[i - 1], cur = sorted[i];
      if (overlaps(toMin(prev.start), toMin(prev.end), toMin(cur.start), toMin(cur.end))) {
        const rink = rinkMap[cur.rinkId];
        add("error", `${rink?.short || "Rink"} ${fmtDate(cur.date)} — two ice times overlap (${fmtRange(toMin(prev.start), toMin(prev.end))} and ${fmtRange(toMin(cur.start), toMin(cur.end))})`, { assignmentId: cur.id });
      }
    }
  }

  // ── Hard conflicts: one team, two places.
  for (const t of teams) {
    const mine = inRange.filter(a => (a.teamIds || []).includes(t.id)).sort((x, y) => toMin(x.start) - toMin(y.start));
    const byDate = {};
    for (const a of mine) (byDate[a.date] = byDate[a.date] || []).push(a);
    for (const [ds, list] of Object.entries(byDate)) {
      for (let i = 1; i < list.length; i++) {
        if (overlaps(toMin(list[i-1].start), toMin(list[i-1].end), toMin(list[i].start), toMin(list[i].end))) {
          add("error", `${t.name} is double-booked on ${fmtDate(ds)}`, { assignmentId: list[i].id, teamId: t.id });
        }
      }
      const w = windowFor(rules, t.ageGroup, ds);
      if (list.length > w.maxPerDay) {
        add("warn", `${t.name} has ${list.length} ice times on ${fmtDate(ds)} (max ${w.maxPerDay})`, { teamId: t.id });
      }
    }
  }

  // ── Window and duration rules.
  for (const a of inRange) {
    const start = toMin(a.start), end = toMin(a.end);
    for (const tid of a.teamIds || []) {
      const t = teamMap[tid];
      if (!t) continue;
      const w = windowFor(rules, t.ageGroup, a.date);
      if (start < w.earliest) {
        add("error", `${t.name} starts ${fmtTime(start)} on ${fmtDate(a.date)} — earlier than the ${AGE_MAP[t.ageGroup]?.label} ${dayTypeOf(a.date)} limit of ${fmtTime(w.earliest)}`, { assignmentId: a.id, teamId: tid });
      }
      if (start > w.latest) {
        add("error", `${t.name} starts ${fmtTime(start)} on ${fmtDate(a.date)} — later than the ${AGE_MAP[t.ageGroup]?.label} ${dayTypeOf(a.date)} limit of ${fmtTime(w.latest)}`, { assignmentId: a.id, teamId: tid });
      }
      if (end - start !== w.duration) {
        add("warn", `${t.name} on ${fmtDate(a.date)} is ${fmtDur(end - start)} — ${AGE_MAP[t.ageGroup]?.label} ice times are normally ${fmtDur(w.duration)}`, { assignmentId: a.id, teamId: tid });
      }
    }
    if ((a.teamIds || []).length > 1) {
      const bands = (a.teamIds || []).map(tid => teamMap[tid]?.ageGroup);
      const allShare = bands.every(b => b && ruleFor(rules, b).allowShared);
      if (!allShare) {
        add("warn", `Shared ice on ${fmtDate(a.date)} includes a team whose age group isn't set up for shared ice`, { assignmentId: a.id });
      }
    }
    // Did a hand-edit push an ice time outside the block it was carved from?
    const slot = slotMap[a.slotId];
    if (slot && (start < toMin(slot.start) || end > toMin(slot.end))) {
      add("error", `${fmtDate(a.date)} ${fmtRange(start, end)} runs outside the purchased block at ${rinkMap[a.rinkId]?.short || "the rink"} (${fmtRange(toMin(slot.start), toMin(slot.end))})`, { assignmentId: a.id });
    }
    if (!slot) {
      add("warn", `An ice time on ${fmtDate(a.date)} isn't attached to a purchased block`, { assignmentId: a.id });
    }
  }

  // ── Team blackouts.
  for (const a of inRange) {
    for (const tid of a.teamIds || []) {
      const t = teamMap[tid];
      if (!t) continue;
      if ((t.blackoutDows || []).includes(dowOf(a.date))) {
        add("warn", `${t.name} is scheduled on ${DOW_LONG[dowOf(a.date)]} but doesn't skate that day`, { assignmentId: a.id, teamId: tid });
      }
      if ((t.blackoutDates || []).includes(a.date)) {
        add("warn", `${t.name} is scheduled on ${fmtDate(a.date)}, one of its blackout dates`, { assignmentId: a.id, teamId: tid });
      }
    }
  }

  // ── Coverage against what was asked for.
  if (requests && requests.length) {
    const need = {};
    for (const r of requests) need[r.teamId] = (need[r.teamId] || 0) + 1;
    for (const [tid, n] of Object.entries(need)) {
      const got = inRange.filter(a => (a.teamIds || []).includes(tid)).length;
      const t = teamMap[tid];
      if (!t) continue;
      if (got < n) add("warn", `${t.name} has ${got} of ${n} requested ice times`, { teamId: tid });
      if (got > n) add("info", `${t.name} has ${got} ice times, ${got - n} more than requested`, { teamId: tid });
    }
  }

  // ── Ice nobody is using.
  const rangeSlots = dates ? slots.filter(s => dates.includes(s.date)) : slots;
  let strandedTotal = 0, openTotal = 0;
  for (const slot of rangeSlots) {
    const u = slotUtilization(slot, inRange);
    strandedTotal += u.stranded;
    openTotal += u.free - u.stranded;
  }
  if (strandedTotal > 0) {
    add("info", `${fmtDur(strandedTotal)} of ice is stranded in gaps too short to use`);
  }
  if (openTotal >= MIN_USEFUL_BLOCK) {
    add("info", `${fmtDur(openTotal)} of ice is still open and bookable`);
  }

  const order = { error: 0, warn: 1, info: 2 };
  issues.sort((a, b) => order[a.severity] - order[b.severity]);
  return issues;
}

// SHARED STYLES
// Mutated in place by applyTheme — see the note there.

const chipStyle = { fontFamily: FONT, fontSize: 13, padding: "5px 12px", borderRadius: 6, borderWidth: 1, borderStyle: "solid", borderColor: C.border, cursor: "pointer", background: C.surface, color: C.text, fontWeight: 500 };
const miniChipStyle = { ...chipStyle, fontSize: 11, padding: "3px 8px" };
const thStyle = { padding: "10px 8px", fontSize: 12, fontWeight: 600, color: C.textMuted, borderBottom: `2px solid ${C.border}`, background: C.surfaceAlt, textAlign: "center", whiteSpace: "nowrap" };
const tdStyle = { padding: "8px 10px", borderBottom: `1px solid ${C.borderLight}`, whiteSpace: "nowrap" };
const inputStyle = { background: C.surfaceAlt, border: `1px solid ${C.border}`, color: C.text, padding: "8px 12px", borderRadius: 6, fontFamily: FONT, fontSize: 14, outline: "none" };

function btn() { return { background: C.surface, borderWidth: 1, borderStyle: "solid", borderColor: C.border, color: C.text, padding: "8px 14px", borderRadius: 6, fontFamily: FONT, fontSize: 13, fontWeight: 500, cursor: "pointer" }; }
function primaryBtn() { return { ...btn(), background: C.accent, borderColor: C.accent, color: C.onAccent, fontWeight: 600 }; }
function dangerBtn() { return { ...btn(), borderColor: C.red, color: C.redText }; }

// ══════════════════════════════════════════════════
// UI ATOMS
// ══════════════════════════════════════════════════
function Modal({ title, onClose, children, width = 520, footer }) {
  useEffect(() => {
    const onKey = e => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", display: "flex", alignItems: "flex-start", justifyContent: "center", padding: 16, zIndex: 100, overflowY: "auto" }}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.surface, borderRadius: 10, border: `1px solid ${C.border}`, width: "100%", maxWidth: width, marginTop: 40, marginBottom: 40, boxShadow: "0 10px 40px rgba(0,0,0,0.18)" }}>
        <div style={{ padding: "14px 18px", borderBottom: `1px solid ${C.borderLight}`, display: "flex", alignItems: "center" }}>
          <span style={{ fontFamily: DISPLAY, fontSize: 17, fontWeight: 700, color: C.text }}>{title}</span>
          <button onClick={onClose} style={{ marginLeft: "auto", background: "transparent", border: "none", color: C.textMuted, fontSize: 20, lineHeight: 1, cursor: "pointer", fontFamily: FONT }}>×</button>
        </div>
        <div style={{ padding: 18 }}>{children}</div>
        {footer && <div style={{ padding: "12px 18px", borderTop: `1px solid ${C.borderLight}`, display: "flex", gap: 8, justifyContent: "flex-end", flexWrap: "wrap" }}>{footer}</div>}
      </div>
    </div>
  );
}

function Field({ label, hint, children, style }) {
  return (
    <div style={{ marginBottom: 12, ...style }}>
      <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: C.textMuted, marginBottom: 5 }}>{label}</label>
      {children}
      {hint && <div style={{ fontSize: 11, color: C.textLight, marginTop: 4, lineHeight: 1.4 }}>{hint}</div>}
    </div>

}

function SectionCard({ title, subtitle, right, children, pad = 16 }) {

          {right && <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>{right}</div>}

}

function AgeChip({ ageGroup, size = 11 }) {
  const a = AGE_MAP[ageGroup];
  return (
    <span style={{ fontSize: size, fontWeight: 700, padding: "1px 6px", borderRadius: 4, background: BAND_BG[ageGroup] || C.surfaceAlt, color: C.text, border: `1px solid ${C.borderLight}` }}>

}

function QualityDot({ quality }) {
  const color = quality === "prime" ? C.green : quality === "rough" ? C.orange : C.textLight;
  return <span title={QUALITY_LABEL[quality]} style={{ display: "inline-block", width: 7, height: 7, borderRadius: "50%", background: color }} />;

// The shared-passphrase speed bump, ported straight across from the lineup
// app: type the phrase, tick the "everyone sees this" box, confirm.
function EditGate({ open, action, onConfirm, onCancel }) {
  const [phrase, setPhrase] = useState("");
  const [ack, setAck] = useState(false);
  const [err, setErr] = useState("");
  useEffect(() => { if (open) { setPhrase(""); setAck(false); setErr(""); } }, [open]);
  if (!open) return null;
  const submit = () => {
    if (phrase.trim().toLowerCase() !== EDIT_PASSPHRASE) { setErr("That's not the passphrase."); return; }
    if (!ack) { setErr("Tick the box to confirm."); return; }
    onConfirm();
  };
  return (
    <Modal title="Confirm shared change" onClose={onCancel} width={440}
      footer={<>
        <button onClick={onCancel} style={btn()}>Cancel</button>
        <button onClick={submit} style={primaryBtn()}>Confirm</button>
      </>}>
      <div style={{ fontSize: 13, color: C.text, lineHeight: 1.5, marginBottom: 14 }}>
        <strong>{action}</strong> — this goes out to everyone with the link.
      </div>
      <Field label="Passphrase">
        <input type="password" value={phrase} autoFocus
          onChange={e => { setPhrase(e.target.value); setErr(""); }}
          onKeyDown={e => { if (e.key === "Enter") submit(); }}
          style={{ ...inputStyle, width: "100%" }} />
      </Field>
      <label style={{ display: "flex", gap: 8, alignItems: "flex-start", fontSize: 12, color: C.textMuted, cursor: "pointer" }}>
        <input type="checkbox" checked={ack} onChange={e => { setAck(e.target.checked); setErr(""); }} style={{ marginTop: 2 }} />
        <span>I understand this changes the schedule for every coach and rink scheduler.</span>
      </label>
      {err && <div style={{ marginTop: 10, fontSize: 12, color: C.redText }}>{err}</div>}
    </Modal>
  );
}

function SlotEditorModal({ slot, rinks, onSave, onDelete, onClose }) {
  const [draft, setDraft] = useState(() => ({
    rinkId: rinks[0]?.id || "",
    date: SEASON_START,
    start: "17:00",
    end: "21:00",
    note: "",
    blocked: false,
    blockLabel: "",
    ...slot,
  }));
  const [err, setErr] = useState("");
  const set = (k, v) => setDraft(d => ({ ...d, [k]: v }));
  const submit = () => {
    if (!draft.rinkId) return setErr("Pick a rink.");
    if (!draft.date) return setErr("Pick a date.");
    if (toMin(draft.end) <= toMin(draft.start)) return setErr("End time has to be after the start time.");
    onSave({ ...draft, id: draft.id || uid("slot") });
  };
  const len = toMin(draft.end) - toMin(draft.start);
  return (
    <Modal title={slot?.id ? "Edit ice block" : "Add ice block"} onClose={onClose} width={460}
      footer={<>
        {slot?.id && <button onClick={() => onDelete(slot.id)} style={{ ...dangerBtn(), marginRight: "auto" }}>Delete</button>}
        <button onClick={onClose} style={btn()}>Cancel</button>
        <button onClick={submit} style={primaryBtn()}>Save block</button>
      </>}>
      <Field label="Rink">
        <select value={draft.rinkId} onChange={e => set("rinkId", e.target.value)} style={{ ...inputStyle, width: "100%" }}>
          {rinks.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
        </select>
      </Field>
      <Field label="Date">
        <input type="date" value={draft.date} onChange={e => set("date", e.target.value)} style={{ ...inputStyle, width: "100%" }} />
      </Field>
      <div style={{ display: "flex", gap: 10 }}>
        <Field label="Start" style={{ flex: 1 }}>
          <input type="time" value={draft.start} step={900} onChange={e => set("start", e.target.value)} style={{ ...inputStyle, width: "100%" }} />
        </Field>
        <Field label="End" style={{ flex: 1 }}>
          <input type="time" value={draft.end} step={900} onChange={e => set("end", e.target.value)} style={{ ...inputStyle, width: "100%" }} />
        </Field>
      </div>
      {len > 0 && <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 12 }}>{fmtDur(len)} of ice.</div>}
      <Field label="Note" hint="Optional — shows on the block in the calendar.">
        <input value={draft.note || ""} onChange={e => set("note", e.target.value)} placeholder="e.g. contract ice, invoice #204" style={{ ...inputStyle, width: "100%" }} />
      </Field>
      <label style={{ display: "flex", gap: 8, alignItems: "center", fontSize: 13, color: C.text, cursor: "pointer", marginTop: 4 }}>
        <input type="checkbox" checked={!!draft.blocked} onChange={e => set("blocked", e.target.checked)} />
        <span>Blocked — reserved for something else, don't schedule teams here</span>
      </label>
      {draft.blocked && (
        <Field label="Blocked for" style={{ marginTop: 10 }}>
          <input value={draft.blockLabel || ""} onChange={e => set("blockLabel", e.target.value)} placeholder="e.g. U13 tournament, public skate" style={{ ...inputStyle, width: "100%" }} />
        </Field>
      )}
      {err && <div style={{ marginTop: 10, fontSize: 12, color: C.redText }}>{err}</div>}
    </Modal>
  );
}

function RecurringIceModal({ rinks, onCreate, onClose }) {
  const [draft, setDraft] = useState({
    rinkId: rinks[0]?.id || "",
    dows: [2],
    start: "17:00",
    end: "21:00",
    from: SEASON_START,
    to: addDays(SEASON_START, 77),   // 12 weeks
    note: "",
  });
  const [err, setErr] = useState("");
  const set = (k, v) => setDraft(d => ({ ...d, [k]: v }));
  const toggleDow = d => setDraft(x => ({ ...x, dows: x.dows.includes(d) ? x.dows.filter(v => v !== d) : [...x.dows, d].sort() }));

  const preview = useMemo(() => {
    if (!draft.from || !draft.to || toMin(draft.end) <= toMin(draft.start)) return [];
    const out = [];
    let ds = draft.from;
    let guard = 0;
    while (ds <= draft.to && guard++ < 500) {
      if (draft.dows.includes(dowOf(ds))) out.push(ds);
      ds = addDays(ds, 1);
    }
    return out;
  }, [draft]);

  const submit = () => {
    if (!draft.rinkId) return setErr("Pick a rink.");
    if (!draft.dows.length) return setErr("Pick at least one day of the week.");
    if (toMin(draft.end) <= toMin(draft.start)) return setErr("End time has to be after the start time.");
    if (!preview.length) return setErr("That pattern doesn't land on any dates.");
    onCreate(preview.map(date => ({
      id: uid("slot"), rinkId: draft.rinkId, date,
      start: draft.start, end: draft.end, note: draft.note, blocked: false,
    })));
  };

  const hours = preview.length * (toMin(draft.end) - toMin(draft.start)) / 60;
  return (
    <Modal title="Add recurring ice" onClose={onClose} width={500}
      footer={<>
        <button onClick={onClose} style={btn()}>Cancel</button>
        <button onClick={submit} style={primaryBtn()}>Add {preview.length} block{preview.length === 1 ? "" : "s"}</button>
      </>}>
      <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 14, lineHeight: 1.5 }}>
        Set the weekly pattern once — every Tuesday 5–9p at Civic 1, say — and it repeats across the date range.
        Individual blocks can be edited or deleted afterwards without touching the rest.
      </div>
      <Field label="Rink">
        <select value={draft.rinkId} onChange={e => set("rinkId", e.target.value)} style={{ ...inputStyle, width: "100%" }}>
          {rinks.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
        </select>
      </Field>
      <Field label="Days of the week">
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {DOW_SHORT.map((d, i) => (
            <button key={i} onClick={() => toggleDow(i)} style={{
              ...miniChipStyle, padding: "6px 10px", fontSize: 12,
              background: draft.dows.includes(i) ? C.accent : C.surface,
              color: draft.dows.includes(i) ? C.onAccent : C.text,
              borderColor: draft.dows.includes(i) ? C.accent : C.border,
              fontWeight: draft.dows.includes(i) ? 600 : 500,
            }}>{d}</button>
          ))}
        </div>
      </Field>
      <div style={{ display: "flex", gap: 10 }}>
        <Field label="Start" style={{ flex: 1 }}>
          <input type="time" step={900} value={draft.start} onChange={e => set("start", e.target.value)} style={{ ...inputStyle, width: "100%" }} />
        </Field>
        <Field label="End" style={{ flex: 1 }}>
          <input type="time" step={900} value={draft.end} onChange={e => set("end", e.target.value)} style={{ ...inputStyle, width: "100%" }} />
        </Field>
      </div>
      <div style={{ display: "flex", gap: 10 }}>
        <Field label="From" style={{ flex: 1 }}>
          <input type="date" value={draft.from} onChange={e => set("from", e.target.value)} style={{ ...inputStyle, width: "100%" }} />
        </Field>
        <Field label="Through" style={{ flex: 1 }}>
          <input type="date" value={draft.to} onChange={e => set("to", e.target.value)} style={{ ...inputStyle, width: "100%" }} />
        </Field>
      </div>
      <Field label="Note">
        <input value={draft.note} onChange={e => set("note", e.target.value)} placeholder="Optional" style={{ ...inputStyle, width: "100%" }} />
      </Field>
      <div style={{ background: C.accentLight, border: `1px solid ${C.border}`, borderRadius: 8, padding: "10px 12px", fontSize: 12, color: C.text }}>
        {preview.length
          ? <>Creates <strong>{preview.length}</strong> blocks — <strong>{hours.toFixed(1)} hours</strong> of ice, {fmtDate(preview[0])} through {fmtDate(preview[preview.length - 1])}.</>
          : "No dates match this pattern yet."}
      </div>
      {err && <div style={{ marginTop: 10, fontSize: 12, color: C.redText }}>{err}</div>}
    </Modal>
  );
}

    <Modal title={fmtDateLong(date)} onClose={onClose} width={560}
      footer={<>

      {!daySlots.length && <div style={{ fontSize: 13, color: C.textMuted }}>No ice purchased on this date.</div>}
      {daySlots.map(slot => {
        const u = slotUtilization(slot, assignments);

                <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 8 }}>

                </div>
              )}
              {booked.map(a => (
                <div key={a.id} style={{ display: "flex", gap: 8, alignItems: "center", fontSize: 12, padding: "3px 0" }}>

        );

function IceTab({ slots, setSlots, assignments, rinks, teams }) {
  const [monthIdx, setMonthIdx] = useState(initialMonthIdx);
  const [editingSlot, setEditingSlot] = useState(null);
  const [recurringOpen, setRecurringOpen] = useState(false);
  const [dayOpen, setDayOpen] = useState(null);
  const rinkMap = useMemo(() => Object.fromEntries(rinks.map(r => [r.id, r])), [rinks]);

  const { y, m } = SEASON_MONTHS[monthIdx];
  const firstOfMonth = new Date(y, m, 1, 12);
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const leadBlanks = firstOfMonth.getDay();

  const monthDates = useMemo(() => {
    const out = [];
    for (let d = 1; d <= daysInMonth; d++) out.push(dateStr(new Date(y, m, d, 12)));
    return out;
  }, [y, m, daysInMonth]);

  const byDate = useMemo(() => {
    const map = {};
    for (const s of slots) (map[s.date] = map[s.date] || []).push(s);
    for (const k of Object.keys(map)) map[k].sort((a, b) => toMin(a.start) - toMin(b.start));
    return map;
  }, [slots]);

  const monthStats = useMemo(() => {
    const ms = slots.filter(s => monthDates.includes(s.date));
    let total = 0, booked = 0, blocked = 0;
    for (const s of ms) {
      const len = toMin(s.end) - toMin(s.start);
      if (s.blocked) { blocked += len; continue; }
      total += len;
      booked += slotUtilization(s, assignments).booked;
    }
    return { total, booked, blocked, blocks: ms.length };
  }, [slots, assignments, monthDates]);

  const saveSlot = slot => {
    setSlots(prev => {
      const exists = prev.some(s => s.id === slot.id);
      return exists ? prev.map(s => s.id === slot.id ? slot : s) : [...prev, slot];
    });
    setEditingSlot(null);
  };
  const deleteSlot = id => {
    setSlots(prev => prev.filter(s => s.id !== id));
    setEditingSlot(null);
  };

  return (
    <div>
      <SectionCard
        title="Ice inventory"
        subtitle="Every block of ice the association has purchased. Teams can only be scheduled inside these."
        right={<>
          <button onClick={() => setRecurringOpen(true)} style={btn()}>Add recurring…</button>
          <button onClick={() => setEditingSlot({ date: monthDates[0] })} style={primaryBtn()}>Add block</button>
        </>}
        pad={0}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 16px", borderBottom: `1px solid ${C.borderLight}` }}>
          <button onClick={() => setMonthIdx(i => Math.max(0, i - 1))} disabled={monthIdx === 0} style={{ ...smallBtn(), opacity: monthIdx === 0 ? 0.4 : 1 }}>‹</button>
          <div style={{ fontFamily: DISPLAY, fontSize: 15, fontWeight: 700, minWidth: 150, textAlign: "center" }}>{MONTHS[m]} {y}</div>
          <button onClick={() => setMonthIdx(i => Math.min(SEASON_MONTHS.length - 1, i + 1))} disabled={monthIdx === SEASON_MONTHS.length - 1} style={{ ...smallBtn(), opacity: monthIdx === SEASON_MONTHS.length - 1 ? 0.4 : 1 }}>›</button>
          <div style={{ marginLeft: "auto", fontSize: 12, color: C.textMuted, display: "flex", gap: 12, flexWrap: "wrap" }}>
            <span><strong style={{ color: C.text }}>{fmtDur(monthStats.total)}</strong> purchased</span>
            <span><strong style={{ color: C.text }}>{monthStats.total ? Math.round(monthStats.booked / monthStats.total * 100) : 0}%</strong> allocated</span>
            {monthStats.blocked > 0 && <span><strong style={{ color: C.orangeText }}>{fmtDur(monthStats.blocked)}</strong> blocked</span>}
          </div>
        </div>

        <div style={{ overflowX: "auto" }}>
          <div style={{ minWidth: 640 }}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", background: C.surfaceAlt, borderBottom: `1px solid ${C.border}` }}>
              {DOW_SHORT.map(d => (
                <div key={d} style={{ padding: "8px 4px", textAlign: "center", fontSize: 11, fontWeight: 600, color: C.textMuted }}>{d}</div>
              ))}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)" }}>
              {Array.from({ length: leadBlanks }).map((_, i) => (
                <div key={`b${i}`} style={{ minHeight: 92, borderRight: `1px solid ${C.borderLight}`, borderBottom: `1px solid ${C.borderLight}`, background: C.surfaceAlt }} />
              ))}
              {monthDates.map(ds => {
                const daySlots = byDate[ds] || [];
                const weekend = isWeekend(ds);
                return (
                  <div key={ds} onClick={() => setDayOpen(ds)} style={{
                    minHeight: 92, padding: 5, cursor: "pointer",
                    borderRight: `1px solid ${C.borderLight}`, borderBottom: `1px solid ${C.borderLight}`,
                    background: weekend ? C.surfaceAlt : C.surface,
                  }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: C.textMuted, marginBottom: 3 }}>{parseDate(ds).getDate()}</div>
                    {daySlots.slice(0, 3).map(s => {
                      const u = slotUtilization(s, assignments);
                      const pct = u.total ? u.booked / u.total : 0;
                      return (
                        <div key={s.id} style={{
                          fontSize: 9.5, lineHeight: 1.25, marginBottom: 2, padding: "2px 3px", borderRadius: 3,
                          background: s.blocked ? C.orangeLight : C.ice,
                          border: `1px solid ${s.blocked ? C.orange : C.iceLine}`,
                          color: C.text, overflow: "hidden", whiteSpace: "nowrap", textOverflow: "ellipsis",
                        }}>
                          <div style={{ fontWeight: 600 }}>{rinkMap[s.rinkId]?.short || "Rink"}</div>
                          <div style={{ color: C.textMuted }}>{fmtRange(toMin(s.start), toMin(s.end))}</div>
                          {!s.blocked && (
                            <div style={{ height: 2, background: C.borderLight, borderRadius: 1, marginTop: 2 }}>
                              <div style={{ height: 2, width: `${Math.round(pct * 100)}%`, background: pct > 0.85 ? C.green : C.accent, borderRadius: 1 }} />
                            </div>
                          )}
                        </div>
                      );
                    })}
                    {daySlots.length > 3 && <div style={{ fontSize: 9.5, color: C.textLight }}>+{daySlots.length - 3} more</div>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </SectionCard>

      {editingSlot && (
        <SlotEditorModal slot={editingSlot} rinks={rinks} onSave={saveSlot} onDelete={deleteSlot} onClose={() => setEditingSlot(null)} />
      )}
      {recurringOpen && (
        <RecurringIceModal rinks={rinks} onClose={() => setRecurringOpen(false)}
          onCreate={newSlots => { setSlots(prev => [...prev, ...newSlots]); setRecurringOpen(false); }} />
      )}
      {dayOpen && (
        <DayDetailModal date={dayOpen} slots={slots} assignments={assignments} rinks={rinks} teams={teams}
          onAdd={ds => { setDayOpen(null); setEditingSlot({ date: ds }); }}
          onEdit={s => { setDayOpen(null); setEditingSlot(s); }}
          onClose={() => setDayOpen(null)} />
      )}
    </div>
  );
}

// TAB 2 — ALLOCATE
// Pick a week, say who needs how much ice, hit Allocate. This is the

function WeekPicker({ weekStart, setWeekStart, compact }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      <button onClick={() => setWeekStart(addDays(weekStart, -7))} style={smallBtn()}>‹</button>
      <div style={{ fontFamily: DISPLAY, fontSize: compact ? 13 : 15, fontWeight: 700, minWidth: compact ? 120 : 150, textAlign: "center" }}>
        {weekLabel(weekStart)}
      </div>
      <button onClick={() => setWeekStart(addDays(weekStart, 7))} style={smallBtn()}>›</button>
    </div>
  );
}

function AllocateTab({
  weekStart, setWeekStart, teams, rinks, slots, assignments, rules,
  requestOverrides, setRequestOverrides, onGenerate, lastResult, isFinalized,
}) {
  const isMobile = useIsMobile();
  const [keepExisting, setKeepExisting] = useState(false);
  const [openSections, setOpenSections] = useState(() => ({ supply: !isMobile, demand: true }));
  const dates = useMemo(() => Array.from({ length: 7 }, (_, i) => addDays(weekStart, i)), [weekStart]);

  const weekSlots = useMemo(() => slots.filter(s => dates.includes(s.date)), [slots, dates]);
  const weekAssignments = useMemo(() => assignments.filter(a => dates.includes(a.date)), [assignments, dates]);

  const supply = useMemo(() => {
    let total = 0, blocked = 0, booked = 0;
    const byRink = {};
    for (const s of weekSlots) {
      const len = toMin(s.end) - toMin(s.start);
      if (s.blocked) { blocked += len; continue; }
      total += len;
      const u = slotUtilization(s, weekAssignments);
      booked += u.booked;
      byRink[s.rinkId] = (byRink[s.rinkId] || 0) + len;
    }
    return { total, blocked, booked, open: total - booked, byRink };
  }, [weekSlots, weekAssignments]);

  const sessionsFor = t => {
    const o = requestOverrides[t.id];
    return o === undefined ? (t.sessionsPerWeek ?? 0) : o;
  };

  const demand = useMemo(() => {
    let minutes = 0, sessions = 0;
    for (const t of teams) {
      const n = sessionsFor(t);
      sessions += n;
      minutes += n * ruleFor(rules, t.ageGroup).durationMin;
    }
    return { minutes, sessions };
  }, [teams, requestOverrides, rules]);

  const tight = demand.minutes > supply.total;
  const setSessions = (teamId, n) => setRequestOverrides(prev => ({ ...prev, [teamId]: clamp(n, 0, 7) }));

  const byBand = useMemo(() => {
    const map = {};
    for (const t of teams) (map[t.ageGroup] = map[t.ageGroup] || []).push(t);
    return map;
  }, [teams]);

  const toggle = k => setOpenSections(s => ({ ...s, [k]: !s[k] }));
  const Header = ({ id, title, right }) => (
    <div onClick={() => toggle(id)} style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", padding: "12px 16px", borderBottom: openSections[id] ? `1px solid ${C.borderLight}` : "none" }}>
      <span style={{ fontFamily: DISPLAY, fontSize: 16, fontWeight: 700 }}>{title}</span>
      {right}
      <span style={{ marginLeft: "auto", color: C.textMuted, fontSize: 12 }}>{openSections[id] ? "▾" : "▸"}</span>
    </div>
  );

  return (
    <div>
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: "12px 16px", marginBottom: 16, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <WeekPicker weekStart={weekStart} setWeekStart={setWeekStart} />
        <button onClick={() => setWeekStart(weekStartOf(dateStr(new Date())))} style={{ ...smallBtn(), marginLeft: "auto" }}>This week</button>
      </div>

      {isFinalized && (
        <div style={{ background: C.orangeLight, border: `1px solid ${C.orange}`, borderRadius: 8, padding: "12px 16px", marginBottom: 16, fontSize: 13, color: C.orangeText, lineHeight: 1.5 }}>
          <strong>This week is published.</strong> Allocating again will replace what teams are already looking at. Unpublish it on the Schedule tab first if that isn't what you want.
        </div>
      )}

      {/* ── Supply ─────────────────────────────────────────── */}
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, marginBottom: 16 }}>
        <Header id="supply" title="Ice available this week" right={
          <span style={{ fontSize: 12, color: C.textMuted }}>{fmtDur(supply.total)} across {weekSlots.filter(s => !s.blocked).length} blocks</span>
        } />
        {openSections.supply && (
          <div style={{ padding: 16 }}>
            {!weekSlots.length && (
              <div style={{ fontSize: 13, color: C.textMuted }}>
                No ice purchased this week. Add blocks on the <strong>Ice</strong> tab first.
              </div>
            )}
            {!!weekSlots.length && (
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 480 }}>
                  <thead>
                    <tr>
                      <th style={{ ...thStyle, textAlign: "left" }}>Day</th>
                      {rinks.map(r => <th key={r.id} style={{ ...thStyle }}>{r.short}</th>)}
                      <th style={{ ...thStyle }}>Total</th>
                    </tr>
                  </thead>
                  <tbody>
                    {dates.map(ds => {
                      const day = weekSlots.filter(s => s.date === ds);
                      const dayTotal = day.reduce((n, s) => n + (s.blocked ? 0 : toMin(s.end) - toMin(s.start)), 0);
                      return (
                        <tr key={ds}>
                          <td style={{ ...tdStyle, textAlign: "left", fontWeight: 600, fontSize: 12 }}>{fmtDate(ds)}</td>
                          {rinks.map(r => {
                            const rs = day.filter(s => s.rinkId === r.id);
                            return (
                              <td key={r.id} style={{ ...tdStyle, textAlign: "center", fontSize: 11, color: rs.length ? C.text : C.textLight }}>
                                {rs.length
                                  ? rs.map(s => (
                                      <div key={s.id} style={{ color: s.blocked ? C.orangeText : C.text }}>
                                        {fmtRange(toMin(s.start), toMin(s.end))}
                                      </div>
                                    ))
                                  : "—"}
                              </td>
                            );
                          })}
                          <td style={{ ...tdStyle, textAlign: "center", fontSize: 12, fontWeight: 600 }}>{dayTotal ? fmtDur(dayTotal) : "—"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}
      </div>

      {/* ── Demand ─────────────────────────────────────────── */}
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, marginBottom: 16 }}>
        <Header id="demand" title="Who needs ice" right={
          <span style={{ fontSize: 12, color: C.textMuted }}>{demand.sessions} ice times · {fmtDur(demand.minutes)}</span>
        } />
        {openSections.demand && (
          <div style={{ padding: 16 }}>
            <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 12, lineHeight: 1.5 }}>
              Defaults come from each team's weekly target on the <strong>Teams</strong> tab. Change a number here to
              override it for this week only — an extra skills session, a bye week, a team away at a tournament.
            </div>
            {AGE_GROUPS.filter(a => byBand[a.id]?.length).map(a => {
              const r = ruleFor(rules, a.id);
              return (
                <div key={a.id} style={{ marginBottom: 14 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                    <AgeChip ageGroup={a.id} size={12} />
                    <span style={{ fontSize: 11, color: C.textMuted }}>
                      {fmtDur(r.durationMin)} ice · weeknights {fmtTime(toMin(r.weekday.earliest))}–{fmtTime(toMin(r.weekday.latest))} start · weekends {fmtTime(toMin(r.weekend.earliest))}–{fmtTime(toMin(r.weekend.latest))} start
                      {r.allowShared ? " · shared ice OK" : ""}
                    </span>
                  </div>
                  {byBand[a.id].map(t => {
                    const n = sessionsFor(t);
                    const overridden = requestOverrides[t.id] !== undefined && requestOverrides[t.id] !== t.sessionsPerWeek;
                    return (
                      <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: `1px solid ${C.borderLight}` }}>
                        <span style={{ fontSize: 13, fontWeight: 500, flex: 1, color: n === 0 ? C.textLight : C.text }}>
                          {t.name}
                          <span style={{ fontSize: 11, color: C.textMuted, marginLeft: 6 }}>{t.level}</span>
                        </span>
                        {overridden && <span style={{ fontSize: 10, fontWeight: 600, color: C.blueText }}>OVERRIDE</span>}
                        <button onClick={() => setSessions(t.id, n - 1)} style={{ ...smallBtn(), width: 30, padding: "5px 0" }}>−</button>
                        <span style={{ minWidth: 22, textAlign: "center", fontSize: 14, fontWeight: 700, color: n === 0 ? C.textLight : C.text }}>{n}</span>
                        <button onClick={() => setSessions(t.id, n + 1)} style={{ ...smallBtn(), width: 30, padding: "5px 0" }}>+</button>
                      </div>
                    );
                  })}
                </div>
              );
            })}
            {Object.keys(requestOverrides).length > 0 && (
              <button onClick={() => setRequestOverrides({})} style={{ ...smallBtn(), marginTop: 4 }}>Reset to weekly targets</button>
            )}
          </div>
        )}
      </div>

      {/* ── Balance + go ───────────────────────────────────── */}
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 14 }}>
          {[
            { label: "Ice available", value: fmtDur(supply.total), tone: C.text },
            { label: "Ice requested", value: fmtDur(demand.minutes), tone: tight ? C.redText : C.text },
            { label: "Slack", value: (supply.total - demand.minutes >= 0 ? "+" : "−") + fmtDur(Math.abs(supply.total - demand.minutes)), tone: tight ? C.redText : C.greenText },
          ].map(s => (
            <div key={s.label} style={{ flex: "1 1 120px" }}>
              <div style={{ fontSize: 11, color: C.textMuted, fontWeight: 600 }}>{s.label}</div>
              <div style={{ fontSize: 20, fontFamily: DISPLAY, fontWeight: 700, color: s.tone }}>{s.value}</div>
            </div>
          ))}
        </div>
        {tight && (
          <div style={{ background: C.redLight, border: `1px solid ${C.red}`, borderRadius: 8, padding: "10px 12px", fontSize: 12, color: C.redText, marginBottom: 12, lineHeight: 1.5 }}>
            More ice is requested than purchased this week. Some teams will come up short — the allocator spreads the
            shortfall rather than starving one team, and lists everything it couldn't place.
          </div>
        )}
        <label style={{ display: "flex", gap: 8, alignItems: "center", fontSize: 13, color: C.text, cursor: "pointer", marginBottom: 14 }}>
          <input type="checkbox" checked={keepExisting} onChange={e => setKeepExisting(e.target.checked)} />
          <span>Keep ice times already on the board this week and fill in around them</span>
        </label>
        <button
          onClick={() => onGenerate({ keepExisting, requests: teams.flatMap(t => Array.from({ length: sessionsFor(t) }, () => ({ teamId: t.id, dates, kind: "practice" }))) })}
          disabled={!weekSlots.length || demand.sessions === 0}
          style={{
            ...primaryBtn(), width: "100%", padding: "14px 0", fontSize: 15,
            opacity: (!weekSlots.length || demand.sessions === 0) ? 0.5 : 1,
            cursor: (!weekSlots.length || demand.sessions === 0) ? "not-allowed" : "pointer",
          }}>
          Allocate ice for {weekLabel(weekStart)}
        </button>
      </div>

      {lastResult && lastResult.weekStart === weekStart && (
        <SectionCard title="Last run" subtitle={`${lastResult.placed} ice times placed · best of ${lastResult.runs} attempts`}>
          {lastResult.unplaced.length === 0 ? (
            <div style={{ fontSize: 13, color: C.greenText }}>Every request was placed.</div>
          ) : (
            <div>
              <div style={{ fontSize: 13, color: C.redText, marginBottom: 8, fontWeight: 600 }}>
                {lastResult.unplaced.length} request{lastResult.unplaced.length === 1 ? "" : "s"} couldn't be placed:
              </div>
              {lastResult.unplaced.map((u, i) => (
                <div key={i} style={{ fontSize: 12, color: C.text, padding: "4px 0", borderBottom: `1px solid ${C.borderLight}` }}>
                  <strong>{u.teamName}</strong> — {u.reason}
                </div>
              ))}
              <div style={{ fontSize: 11, color: C.textMuted, marginTop: 10, lineHeight: 1.5 }}>
                Usually this means no purchased block overlaps that age group's start window on any day they're
                available. Buying earlier ice, widening the window on the <strong>Teams</strong> tab, or turning on
                shared ice for the younger bands are the three fixes.
              </div>
            </div>
          )}
        </SectionCard>
      )}
    </div>
  );
}

// EXPORTS
// Three flavours, all generated in the browser with no server:
//   • CSV for the invoicing/accounting side
//   • .ics so a coach can subscribe once and stop asking
//   • a self-contained printable HTML week for the arena office wall

function downloadBlob(filename, text, mime = "text/plain") {
  const url = URL.createObjectURL(new Blob([text], { type: `${mime};charset=utf-8` }));
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportCSV(assignments, { teams, rinks, label }) {
  const teamMap = Object.fromEntries(teams.map(t => [t.id, t]));
  const rinkMap = Object.fromEntries(rinks.map(r => [r.id, r]));
  const rows = [["Date", "Day", "Rink", "Start", "End", "Minutes", "Teams", "Age group", "Type", "Shared", "Ice quality"]];
  const sorted = [...assignments].sort((a, b) => a.date.localeCompare(b.date) || toMin(a.start) - toMin(b.start));
  for (const a of sorted) {
    const ts = (a.teamIds || []).map(id => teamMap[id]?.name || id);
    const band = teamMap[a.teamIds?.[0]]?.ageGroup;
    rows.push([
      a.date, DOW_LONG[dowOf(a.date)], rinkMap[a.rinkId]?.name || a.rinkId,
      a.start, a.end, String(toMin(a.end) - toMin(a.start)),
      ts.join(" + "), AGE_MAP[band]?.label || "", SESSION_KIND_MAP[a.kind]?.label || "Practice",
      (a.teamIds || []).length > 1 ? "Yes" : "No",
      QUALITY_LABEL[slotQuality(a.date, toMin(a.start))],
    ]);
  }
  const csv = rows.map(r => r.map(c => /[",\n]/.test(c) ? `"${c.replace(/"/g, '""')}"` : c).join(",")).join("\n");
  downloadBlob(`ice-schedule-${label}.csv`, csv, "text/csv");
}

function exportICS(assignments, { teams, rinks, label, teamFilter }) {
  const teamMap = Object.fromEntries(teams.map(t => [t.id, t]));
  const rinkMap = Object.fromEntries(rinks.map(r => [r.id, r]));
  const pad = n => String(n).padStart(2, "0");
  const stamp = d => `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
  // Floating local times (no TZID) — every ice time is local to the rink,
  // and floating means the calendar app shows exactly what's written.
  const local = (ds, min) => `${ds.replace(/-/g, "")}T${toHHMM(min).replace(":", "")}00`;
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Ice Scheduler//EN", "CALSCALE:GREGORIAN", `X-WR-CALNAME:Ice schedule ${label}`];
  const now = stamp(new Date());
  const list = teamFilter ? assignments.filter(a => (a.teamIds || []).includes(teamFilter)) : assignments;
  for (const a of list) {
    const names = (a.teamIds || []).map(id => teamMap[id]?.name || id).join(" + ");
    const rink = rinkMap[a.rinkId]?.name || "Rink";
    lines.push(
      "BEGIN:VEVENT",
      `UID:${a.id}@icescheduler`,
      `DTSTAMP:${now}`,
      `DTSTART:${local(a.date, toMin(a.start))}`,
      `DTEND:${local(a.date, toMin(a.end))}`,
      `SUMMARY:${names} — ${SESSION_KIND_MAP[a.kind]?.label || "Practice"}`,
      `LOCATION:${rink}`,
      `DESCRIPTION:${fmtDur(toMin(a.end) - toMin(a.start))} at ${rink}${(a.teamIds || []).length > 1 ? " (shared ice)" : ""}`,
      "END:VEVENT",
    );
  }
  lines.push("END:VCALENDAR");
  downloadBlob(`ice-${teamFilter ? teamMap[teamFilter]?.name.replace(/\s+/g, "-").toLowerCase() : "all"}-${label}.ics`, lines.join("\r\n"), "text/calendar");
}

function exportPrintable(assignments, { teams, rinks, dates, label }) {
  const teamMap = Object.fromEntries(teams.map(t => [t.id, t]));
  const rinkMap = Object.fromEntries(rinks.map(r => [r.id, r]));
  const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const body = dates.map(ds => {
    const day = assignments.filter(a => a.date === ds).sort((x, y) => toMin(x.start) - toMin(y.start));
    if (!day.length) return `<section><h2>${esc(fmtDateLong(ds))}</h2><p class="none">No ice scheduled.</p></section>`;
    const rows = day.map(a => `<tr>
      <td class="t">${esc(fmtRange(toMin(a.start), toMin(a.end)))}</td>
      <td>${esc(rinkMap[a.rinkId]?.short || "")}</td>
      <td class="team">${esc((a.teamIds || []).map(id => teamMap[id]?.name || id).join(" + "))}</td>
      <td class="k">${esc(SESSION_KIND_MAP[a.kind]?.label || "Practice")}</td>
    </tr>`).join("");
    return `<section><h2>${esc(fmtDateLong(ds))}</h2><table>${rows}</table></section>`;
  }).join("");
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Ice schedule ${esc(label)}</title>
<style>
  body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;color:#2c2c2c;margin:24px;max-width:760px}
  h1{font-family:Georgia,serif;font-size:22px;margin-bottom:2px}
  .sub{color:#777;font-size:12px;margin-bottom:20px}
  section{margin-bottom:18px;break-inside:avoid}
  h2{font-size:14px;border-bottom:2px solid #333;padding-bottom:3px;margin-bottom:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:4px 6px;border-bottom:1px solid #eee}
  td.t{white-space:nowrap;width:110px;color:#555}
  td.team{font-weight:600}
  td.k{text-align:right;color:#777;font-size:11px;width:70px}
  .none{color:#999;font-size:12px}
  @media print{body{margin:0}}
</style></head><body>
<h1>Ice schedule</h1><div class="sub">${esc(label)} · generated ${esc(new Date().toLocaleDateString())}</div>
${body}
</body></html>`;
  downloadBlob(`ice-schedule-${label}.html`, html, "text/html");
}
