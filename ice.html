function ValidationPanel({ issues, open, setOpen, onRefresh }) {
  const errors = issues.filter(i => i.severity === "error");
  const warns  = issues.filter(i => i.severity === "warn");
  const worst = errors[0] || warns[0] || issues[0];
  const tone = errors.length ? { bg: C.redLight, border: C.red, text: C.redText, label: `${errors.length} conflict${errors.length === 1 ? "" : "s"}` }
             : warns.length  ? { bg: C.orangeLight, border: C.orange, text: C.orangeText, label: `${warns.length} warning${warns.length === 1 ? "" : "s"}` }
             : { bg: C.greenLight, border: C.green, text: C.greenText, label: "No conflicts" };
  return (
    <div style={{ background: tone.bg, border: `1px solid ${tone.border}`, borderRadius: 10, marginBottom: 16, overflow: "hidden" }}>
      <div onClick={() => setOpen(!open)} style={{ padding: "10px 14px", display: "flex", alignItems: "center", gap: 10, cursor: "pointer", flexWrap: "wrap" }}>
        <span style={{ fontSize: 11, fontWeight: 700, color: C.onAccent, background: tone.border, padding: "2px 8px", borderRadius: 4 }}>{tone.label}</span>
        {!open && worst && <span style={{ fontSize: 12, color: tone.text, flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{worst.message}</span>}
        <button onClick={e => { e.stopPropagation(); onRefresh(); }} style={{ ...smallBtn(), marginLeft: "auto" }}>Recheck</button>
        <span style={{ color: tone.text, fontSize: 12 }}>{open ? "▾" : "▸"}</span>
      </div>
      {open && (
        <div style={{ background: C.surface, borderTop: `1px solid ${tone.border}`, padding: "8px 14px", maxHeight: 260, overflowY: "auto" }}>
          {!issues.length && <div style={{ fontSize: 12, color: C.textMuted, padding: "6px 0" }}>Nothing to report.</div>}
          {issues.map((iss, i) => {
            const c = iss.severity === "error" ? C.redText : iss.severity === "warn" ? C.orangeText : C.textMuted;
            return (
              <div key={i} style={{ display: "flex", gap: 8, alignItems: "flex-start", padding: "5px 0", borderBottom: i < issues.length - 1 ? `1px solid ${C.borderLight}` : "none" }}>
                <span style={{ fontSize: 10, fontWeight: 700, color: c, minWidth: 42, paddingTop: 1 }}>{iss.severity.toUpperCase()}</span>
                <span style={{ fontSize: 12, color: C.text, lineHeight: 1.45 }}>{iss.message}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function AssignModal({ slot, segment, teams, rules, assignments, rinks, onAssign, onClose }) {
  const [teamId, setTeamId] = useState("");
  const [start, setStart] = useState(null);

  // For each team, work out whether it can legally take this gap and why not
  // if it can't. This is the same rule set the allocator uses.
  const options = useMemo(() => teams.map(t => {
    const w = windowFor(rules, t.ageGroup, slot.date);
    const lo = Math.max(segment.start, w.earliest);
    const hi = Math.min(segment.end - w.duration, w.latest);
    if ((t.blackoutDows || []).includes(dowOf(slot.date))) return { team: t, ok: false, why: `doesn't skate ${DOW_SHORT[dowOf(slot.date)]}` };
    if ((t.blackoutDates || []).includes(slot.date)) return { team: t, ok: false, why: "blackout date" };
    if (segment.end - segment.start < w.duration) return { team: t, ok: false, why: `needs ${fmtDur(w.duration)}, gap is ${fmtDur(segment.end - segment.start)}` };
    if (hi < lo) return { team: t, ok: false, why: `start window is ${fmtTime(w.earliest)}–${fmtTime(w.latest)}` };
    if (teamBusy(assignments, t.id, slot.date, lo, lo + w.duration)) return { team: t, ok: false, why: "already on the ice then" };
    return { team: t, ok: true, lo, hi, duration: w.duration };
  }), [teams, rules, slot, segment, assignments]);

  const chosen = options.find(o => o.team.id === teamId);
  const effStart = start ?? chosen?.lo ?? segment.start;
  const starts = useMemo(() => {
    if (!chosen?.ok) return [];
    const out = [];
    for (let t = Math.ceil(chosen.lo / STEP) * STEP; t <= chosen.hi; t += STEP) out.push(t);
    if (!out.includes(chosen.lo)) out.unshift(chosen.lo);
    return out;
  }, [chosen]);

  return (
    <Modal title="Add a team to this ice" onClose={onClose} width={480}
      footer={<>
        <button onClick={onClose} style={btn()}>Cancel</button>
        <button disabled={!chosen?.ok} onClick={() => onAssign({ teamId, start: effStart, end: effStart + chosen.duration })}
          style={{ ...primaryBtn(), opacity: chosen?.ok ? 1 : 0.5, cursor: chosen?.ok ? "pointer" : "not-allowed" }}>Add ice time</button>
      </>}>
      <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 14 }}>
        {rinks.find(r => r.id === slot.rinkId)?.name} · {fmtDateLong(slot.date)} · open {fmtRange(segment.start, segment.end)} ({fmtDur(segment.end - segment.start)})
      </div>
      <Field label="Team">
        <div style={{ maxHeight: 260, overflowY: "auto", border: `1px solid ${C.border}`, borderRadius: 8 }}>
          {options.map(o => (
            <div key={o.team.id} onClick={() => o.ok && (setTeamId(o.team.id), setStart(null))} style={{
              padding: "8px 12px", display: "flex", alignItems: "center", gap: 8,
              cursor: o.ok ? "pointer" : "not-allowed",
              background: teamId === o.team.id ? C.accentLight : "transparent",
              borderBottom: `1px solid ${C.borderLight}`, opacity: o.ok ? 1 : 0.55,
            }}>
              <AgeChip ageGroup={o.team.ageGroup} />
              <span style={{ fontSize: 13, fontWeight: 500 }}>{o.team.name}</span>
              <span style={{ marginLeft: "auto", fontSize: 11, color: o.ok ? C.greenText : C.textMuted }}>
                {o.ok ? `${fmtDur(o.duration)} · from ${fmtTime(o.lo)}` : o.why}
              </span>
            </div>
          ))}
        </div>
      </Field>
      {chosen?.ok && (
        <Field label="Start time" hint={`Allowed between ${fmtTime(chosen.lo)} and ${fmtTime(chosen.hi)} for this age group on a ${dayTypeOf(slot.date)}.`}>
          <select value={effStart} onChange={e => setStart(Number(e.target.value))} style={{ ...inputStyle, width: "100%" }}>
            {starts.map(s => <option key={s} value={s}>{fmtRange(s, s + chosen.duration)}</option>)}
          </select>
        </Field>
      )}
    </Modal>
  );
}

function IceTimeModal({ assignment, teams, rinks, slots, rules, assignments, onSave, onDelete, onClose }) {
  const [draft, setDraft] = useState({ ...assignment });
  const teamMap = Object.fromEntries(teams.map(t => [t.id, t]));
  const slot = slots.find(s => s.id === draft.slotId);
  const primary = teamMap[draft.teamIds?.[0]];
  const set = (k, v) => setDraft(d => ({ ...d, [k]: v }));

  // Legal starts for the primary team inside the block, ignoring this ice
  // time's own footprint so it can slide over itself.
  const others = assignments.filter(a => a.id !== assignment.id);
  const starts = useMemo(() => {
    if (!slot || !primary) return [];
    const w = windowFor(rules, primary.ageGroup, slot.date);
    const dur = toMin(draft.end) - toMin(draft.start);
    const out = [];
    for (let t = toMin(slot.start); t + dur <= toMin(slot.end); t += STEP) {
      if (t < w.earliest || t > w.latest) continue;
      const clash = others.some(a => a.slotId === slot.id && overlaps(toMin(a.start), toMin(a.end), t, t + dur));
      if (clash) continue;
      out.push(t);
    }
    if (!out.includes(toMin(draft.start))) out.unshift(toMin(draft.start));
    return out.sort((a, b) => a - b);
  }, [slot, primary, draft.start, draft.end, rules, others]);

  const dur = toMin(draft.end) - toMin(draft.start);
  return (
    <Modal title="Ice time" onClose={onClose} width={460}
      footer={<>
        <button onClick={() => onDelete(assignment.id)} style={{ ...dangerBtn(), marginRight: "auto" }}>Remove</button>
        <button onClick={onClose} style={btn()}>Cancel</button>
        <button onClick={() => onSave(draft)} style={primaryBtn()}>Save</button>
      </>}>
      <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 14 }}>
        {rinks.find(r => r.id === draft.rinkId)?.name} · {fmtDateLong(draft.date)}
      </div>
      <Field label="Team">
        <select value={draft.teamIds?.[0] || ""} onChange={e => set("teamIds", [e.target.value, ...(draft.teamIds || []).slice(1)])} style={{ ...inputStyle, width: "100%" }}>
          {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
      </Field>
      {(draft.teamIds || []).length > 1 && (
        <Field label="Sharing with">
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <select value={draft.teamIds[1]} onChange={e => set("teamIds", [draft.teamIds[0], e.target.value])} style={{ ...inputStyle, flex: 1 }}>
              {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
            <button onClick={() => { set("teamIds", [draft.teamIds[0]]); set("shared", false); }} style={smallBtn()}>Unshare</button>
          </div>
        </Field>
      )}
      <Field label="Start" hint={primary ? `${AGE_MAP[primary.ageGroup]?.label} may start between ${fmtTime(windowFor(rules, primary.ageGroup, draft.date).earliest)} and ${fmtTime(windowFor(rules, primary.ageGroup, draft.date).latest)} on a ${dayTypeOf(draft.date)}.` : null}>
        <select value={toMin(draft.start)} onChange={e => { const s = Number(e.target.value); setDraft(d => ({ ...d, start: toHHMM(s), end: toHHMM(s + dur) })); }} style={{ ...inputStyle, width: "100%" }}>
          {starts.map(s => <option key={s} value={s}>{fmtRange(s, s + dur)}</option>)}
        </select>
      </Field>
      <Field label="Length">
        <select value={dur} onChange={e => setDraft(d => ({ ...d, end: toHHMM(toMin(d.start) + Number(e.target.value)) }))} style={{ ...inputStyle, width: "100%" }}>
          {[30, 45, 50, 60, 75, 80, 90, 105, 120].map(n => <option key={n} value={n}>{fmtDur(n)}</option>)}
        </select>
      </Field>
      <Field label="Type">
        <div style={{ display: "flex", gap: 6 }}>
          {SESSION_KINDS.map(k => (
            <button key={k.id} onClick={() => set("kind", k.id)} style={{
              ...chipStyle, flex: 1,
              background: draft.kind === k.id ? C.accent : C.surface,
              color: draft.kind === k.id ? C.onAccent : C.text,
              borderColor: draft.kind === k.id ? C.accent : C.border,
            }}>{k.label}</button>
          ))}
        </div>
      </Field>
    </Modal>
  );
}

function ScheduleTab({
  weekStart, setWeekStart, assignments, setAssignments, teams, rinks, slots, rules,
  isFinalized, onTogglePublish,
}) {
  const isMobile = useIsMobile();
  const [view, setView] = useState("board");
  const [swapMode, setSwapMode] = useState(false);
  const [swapPick, setSwapPick] = useState(null);
  const [openAssign, setOpenAssign] = useState(null);     // { slot, segment }
  const [openIceTime, setOpenIceTime] = useState(null);
  const [panelOpen, setPanelOpen] = useState(false);
  const [history, setHistory] = useState([]);
  const [future, setFuture] = useState([]);
  const [baseline, setBaseline] = useState(null);
  const [nonce, setNonce] = useState(0);

  const dates = useMemo(() => Array.from({ length: 7 }, (_, i) => addDays(weekStart, i)), [weekStart]);
  const teamMap = useMemo(() => Object.fromEntries(teams.map(t => [t.id, t])), [teams]);
  const rinkMap = useMemo(() => Object.fromEntries(rinks.map(r => [r.id, r])), [rinks]);
  const weekAssignments = useMemo(() => assignments.filter(a => dates.includes(a.date)), [assignments, dates]);
  const weekSlots = useMemo(() => slots.filter(s => dates.includes(s.date)), [slots, dates]);

  // Snapshot the week the first time it's viewed so Reset has something to
  // go back to.
  useEffect(() => { setBaseline(weekAssignments.map(a => ({ ...a }))); setHistory([]); setFuture([]); }, [weekStart]);

  const issues = useMemo(
    () => validateSchedule({ assignments, teams, slots, rinks, rules, dates }),
    [assignments, teams, slots, rinks, rules, dates, nonce]
  );

  const commit = next => {
    setHistory(h => [...h, assignments.map(a => ({ ...a }))]);
    setFuture([]);
    setAssignments(next);
  };
  const undo = () => {
    if (!history.length) return;
    const prev = history[history.length - 1];
    setHistory(h => h.slice(0, -1));
    setFuture(f => [...f, assignments.map(a => ({ ...a }))]);
    setAssignments(prev);
  };
  const redo = () => {
    if (!future.length) return;
    const nxt = future[future.length - 1];
    setFuture(f => f.slice(0, -1));
    setHistory(h => [...h, assignments.map(a => ({ ...a }))]);
    setAssignments(nxt);
  };
  const resetWeek = () => {
    if (!baseline) return;
    commit([...assignments.filter(a => !dates.includes(a.date)), ...baseline.map(a => ({ ...a }))]);
  };

  const handleCardClick = a => {
    if (isFinalized) return;
    if (!swapMode) { setOpenIceTime(a); return; }
    if (!swapPick) { setSwapPick(a.id); return; }
    if (swapPick === a.id) { setSwapPick(null); return; }
    const other = assignments.find(x => x.id === swapPick);
    if (!other) { setSwapPick(null); return; }
    // Swap the teams, not the ice times — the ice stays where it is, the
    // teams trade places. Length differences are left for validation to
    // flag rather than silently resizing anyone's ice.
    commit(assignments.map(x =>
      x.id === a.id ? { ...x, teamIds: other.teamIds, kind: other.kind } :
      x.id === other.id ? { ...x, teamIds: a.teamIds, kind: a.kind } : x
    ));
    setSwapPick(null);
  };

  const label = weekLabel(weekStart).replace(/[^\w-]+/g, "-").toLowerCase();

  const stats = useMemo(() => {
    let purchased = 0, booked = 0;
    for (const s of weekSlots) {
      if (s.blocked) continue;
      purchased += toMin(s.end) - toMin(s.start);
      booked += slotUtilization(s, weekAssignments).booked;
    }
    return { purchased, booked, pct: purchased ? Math.round(booked / purchased * 100) : 0, count: weekAssignments.length };
  }, [weekSlots, weekAssignments]);

  return (
    <div>
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: "12px 16px", marginBottom: 16, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <WeekPicker weekStart={weekStart} setWeekStart={setWeekStart} compact={isMobile} />
        <div style={{ fontSize: 12, color: C.textMuted, display: "flex", gap: 10, flexWrap: "wrap" }}>
          <span><strong style={{ color: C.text }}>{stats.count}</strong> ice times</span>
          <span><strong style={{ color: C.text }}>{stats.pct}%</strong> of {fmtDur(stats.purchased)} used</span>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 6, flexWrap: "wrap" }}>
          {["board", "teams"].map(v => (
            <button key={v} onClick={() => setView(v)} style={{
              ...smallBtn(),
              background: view === v ? C.accent : C.surface,
              color: view === v ? C.onAccent : C.text,
              borderColor: view === v ? C.accent : C.border,
              fontWeight: view === v ? 600 : 500,
            }}>{v === "board" ? "Board" : "By team"}</button>
          ))}
        </div>
      </div>

      {isFinalized && (
        <div style={{ background: C.blueLight, border: `1px solid ${C.blue}`, borderRadius: 8, padding: "10px 14px", marginBottom: 16, fontSize: 12, color: C.blueText, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <strong>Published.</strong> <span>Teams are looking at this week. Unpublish to make changes.</span>
        </div>
      )}

      <ValidationPanel issues={issues} open={panelOpen} setOpen={setPanelOpen} onRefresh={() => setNonce(n => n + 1)} />

      {view === "board" ? (
        <BoardView
          dates={dates} slots={weekSlots} assignments={weekAssignments}
          rinkMap={rinkMap} teamMap={teamMap} rinks={rinks}
          swapMode={swapMode} swapPick={swapPick} isFinalized={isFinalized}
          onCardClick={handleCardClick}
          onGapClick={(slot, segment) => !isFinalized && setOpenAssign({ slot, segment })}
        />
      ) : (
        <TeamWeekView dates={dates} assignments={weekAssignments} teams={teams} rinks={rinks} rinkMap={rinkMap} label={label} />
      )}

      <SectionCard title="Edit" pad={14}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={() => { setSwapMode(m => !m); setSwapPick(null); }} disabled={isFinalized} style={{
            ...btn(), opacity: isFinalized ? 0.5 : 1,
            background: swapMode ? C.accent : C.surface, color: swapMode ? C.onAccent : C.text,
            borderColor: swapMode ? C.accent : C.border, fontWeight: swapMode ? 600 : 500,
          }}>{swapMode ? "Swap mode: on" : "Swap teams"}</button>
          <button onClick={undo} disabled={!history.length || isFinalized} style={{ ...btn(), opacity: (!history.length || isFinalized) ? 0.5 : 1 }}>Undo</button>
          <button onClick={redo} disabled={!future.length || isFinalized} style={{ ...btn(), opacity: (!future.length || isFinalized) ? 0.5 : 1 }}>Redo</button>
          <button onClick={resetWeek} disabled={isFinalized} style={{ ...btn(), opacity: isFinalized ? 0.5 : 1 }}>Reset week</button>
          <button onClick={onTogglePublish} style={{ ...(isFinalized ? btn() : primaryBtn()), marginLeft: "auto" }}>
            {isFinalized ? "Unpublish week" : "Publish week"}
          </button>
        </div>
        {swapMode && (
          <div style={{ marginTop: 10, fontSize: 12, color: C.textMuted }}>
            {swapPick ? "Now tap the ice time to swap it with." : "Tap two ice times to trade the teams between them."}
          </div>
        )}
      </SectionCard>

      <SectionCard title="Share this week" subtitle="Everything generates in the browser — nothing is uploaded." pad={14}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={() => exportPrintable(weekAssignments, { teams, rinks, dates, label })} style={btn()}>Printable sheet</button>
          <button onClick={() => exportCSV(weekAssignments, { teams, rinks, label })} style={btn()}>CSV</button>
          <button onClick={() => exportICS(weekAssignments, { teams, rinks, label })} style={btn()}>Calendar (.ics)</button>
        </div>
      </SectionCard>

      {openAssign && (
        <AssignModal
          slot={openAssign.slot} segment={openAssign.segment} teams={teams} rules={rules}
          assignments={assignments} rinks={rinks}
          onClose={() => setOpenAssign(null)}
          onAssign={({ teamId, start, end }) => {
            commit([...assignments, {
              id: uid("ice"), slotId: openAssign.slot.id, rinkId: openAssign.slot.rinkId,
              date: openAssign.slot.date, start: toHHMM(start), end: toHHMM(end),
              teamIds: [teamId], kind: "practice", locked: false, shared: false,
            }]);
            setOpenAssign(null);
          }} />
      )}
      {openIceTime && (
        <IceTimeModal
          assignment={openIceTime} teams={teams} rinks={rinks} slots={slots} rules={rules} assignments={assignments}
          onClose={() => setOpenIceTime(null)}
          onSave={next => { commit(assignments.map(a => a.id === next.id ? { ...next, shared: (next.teamIds || []).length > 1 } : a)); setOpenIceTime(null); }}
          onDelete={id => { commit(assignments.filter(a => a.id !== id)); setOpenIceTime(null); }} />
      )}
    </div>
  );
}

// One rink's worth of a single day: the purchased block(s) with the ice
// times inside them and whatever gaps are left over.
function RinkColumn({ rink, slots, assignments, teamMap, swapMode, swapPick, isFinalized, onCardClick, onGapClick }) {
  return (
    <div style={{ flex: "1 1 190px", minWidth: 180 }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, padding: "0 0 6px", borderBottom: `1px solid ${C.borderLight}`, marginBottom: 6 }}>
        {rink?.short || "Rink"}
      </div>
      {slots.map(slot => {
        if (slot.blocked) {
          return (
            <div key={slot.id} style={{ background: C.orangeLight, border: `1px dashed ${C.orange}`, borderRadius: 6, padding: "8px 10px", marginBottom: 6 }}>
              <div style={{ fontSize: 11, color: C.orangeText, fontWeight: 600 }}>{fmtRange(toMin(slot.start), toMin(slot.end))}</div>
              <div style={{ fontSize: 11, color: C.orangeText }}>Blocked{slot.blockLabel ? ` — ${slot.blockLabel}` : ""}</div>
            </div>
          );
        }
        // Interleave booked ice times and free gaps in clock order.
        const booked = assignmentsInSlot(assignments, slot.id);
        const gaps = freeSegments(slot, assignments);
        const items = [
          ...booked.map(a => ({ kind: "ice", start: toMin(a.start), a })),
          ...gaps.map(g => ({ kind: "gap", start: g.start, g })),
        ].sort((x, y) => x.start - y.start);

        return (
          <div key={slot.id} style={{ marginBottom: 8 }}>
            <div style={{ fontSize: 10, color: C.textLight, marginBottom: 3 }}>
              block {fmtRange(toMin(slot.start), toMin(slot.end))}
            </div>
            {items.map((item, i) => {
              if (item.kind === "gap") {
                const len = item.g.end - item.g.start;
                const usable = len >= MIN_USEFUL_BLOCK;
                return (
                  <div key={`g${i}`} onClick={() => usable && onGapClick(slot, item.g)} style={{
                    border: `1px dashed ${usable ? C.iceLine : C.borderLight}`,
                    background: usable ? "transparent" : C.surfaceAlt,
                    borderRadius: 6, padding: "6px 8px", marginBottom: 4,
                    cursor: usable && !isFinalized ? "pointer" : "default",
                    opacity: usable ? 1 : 0.7,
                  }}>
                    <div style={{ fontSize: 11, color: C.textMuted, fontWeight: 600 }}>{fmtRange(item.g.start, item.g.end)}</div>
                    <div style={{ fontSize: 10, color: C.textLight }}>
                      {usable ? `Open — ${fmtDur(len)}` : `${fmtDur(len)} stranded`}
                    </div>
                  </div>
                );
              }
              const a = item.a;
              const primary = teamMap[a.teamIds?.[0]];
              const band = primary?.ageGroup;
              const q = slotQuality(a.date, toMin(a.start));
              const selected = swapPick === a.id;
              const edge = selected ? C.accent : C.borderLight;
              return (
                <div key={a.id} className={selected ? "swap-selected" : ""} onClick={() => onCardClick(a)} style={{
                  background: BAND_BG[band] || C.surfaceAlt,
                  borderWidth: "1px 1px 1px 3px", borderStyle: "solid",
                  borderColor: [edge, edge, edge, SESSION_KIND_MAP[a.kind]?.color?.() || C.blue].join(" "),
                  borderRadius: 6, padding: "6px 8px", marginBottom: 4,
                  cursor: isFinalized ? "default" : "pointer",
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                    <span style={{ fontSize: 11, fontWeight: 700, color: C.text }}>{fmtRange(toMin(a.start), toMin(a.end))}</span>
                    <QualityDot quality={q} />
                    {(a.teamIds || []).length > 1 && <span style={{ fontSize: 9, fontWeight: 700, color: C.blueText }}>SHARED</span>}
                  </div>
                  <div style={{ fontSize: 12, fontWeight: 600, color: C.text, lineHeight: 1.3 }}>
                    {(a.teamIds || []).map(id => teamMap[id]?.name || "?").join(" + ")}
                  </div>
                  {a.kind && a.kind !== "practice" && (
                    <div style={{ fontSize: 10, color: C.textMuted }}>{SESSION_KIND_MAP[a.kind]?.label}</div>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

function BoardView({ dates, slots, assignments, rinkMap, teamMap, rinks, swapMode, swapPick, isFinalized, onCardClick, onGapClick }) {
  const anyIce = slots.length > 0;
  if (!anyIce) {
    return (
      <SectionCard title="Nothing to show">
        <div style={{ fontSize: 13, color: C.textMuted, lineHeight: 1.6 }}>
          No ice is purchased for this week. Add blocks on the <strong>Ice</strong> tab, then allocate teams into them
          on the <strong>Allocate</strong> tab.
        </div>
      </SectionCard>
    );
  }
  return (
    <div>
      {dates.map(ds => {
        const daySlots = slots.filter(s => s.date === ds);
        const dayAssignments = assignments.filter(a => a.date === ds);
        const rinkIds = rinks.map(r => r.id).filter(id => daySlots.some(s => s.rinkId === id));
        return (
          <div key={ds} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, marginBottom: 12, overflow: "hidden" }}>
            <div style={{ padding: "9px 14px", background: isWeekend(ds) ? C.accentLight : C.surfaceAlt, borderBottom: `1px solid ${C.borderLight}`, display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontFamily: DISPLAY, fontSize: 14, fontWeight: 700 }}>{fmtDateLong(ds)}</span>
              <span style={{ fontSize: 11, color: C.textMuted, marginLeft: "auto" }}>
                {dayAssignments.length ? `${dayAssignments.length} ice time${dayAssignments.length === 1 ? "" : "s"}` : "no ice scheduled"}
              </span>
            </div>
            {!rinkIds.length ? (
              <div style={{ padding: "12px 14px", fontSize: 12, color: C.textLight }}>No ice purchased.</div>
            ) : (
              <div style={{ display: "flex", gap: 14, padding: 14, flexWrap: "wrap", alignItems: "flex-start" }}>
                {rinkIds.map(rid => (
                  <RinkColumn key={rid}
                    rink={rinkMap[rid]}
                    slots={daySlots.filter(s => s.rinkId === rid).sort((a, b) => toMin(a.start) - toMin(b.start))}
                    assignments={dayAssignments}
                    teamMap={teamMap}
                    swapMode={swapMode} swapPick={swapPick} isFinalized={isFinalized}
                    onCardClick={onCardClick} onGapClick={onGapClick} />
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// The same week from the coaches' side: one row per team, one column per
// day. This is the view that gets screenshotted into a team chat.
function TeamWeekView({ dates, assignments, teams, rinks, rinkMap, label }) {
  const byBand = useMemo(() => {
    const map = {};
    for (const t of teams) (map[t.ageGroup] = map[t.ageGroup] || []).push(t);
    return map;
  }, [teams]);
  return (
    <SectionCard title="By team" subtitle="Every team's week at a glance. The ⤓ button downloads that team's calendar file." pad={0}>
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 720 }}>
          <thead>
            <tr>
              <th style={{ ...thStyle, textAlign: "left", position: "sticky", left: 0, background: C.surfaceAlt, zIndex: 1 }}>Team</th>
              {dates.map(ds => <th key={ds} style={{ ...thStyle }}>{fmtDate(ds)}</th>)}
              <th style={{ ...thStyle }}>Total</th>
            </tr>
          </thead>
          <tbody>
            {AGE_GROUPS.filter(a => byBand[a.id]?.length).map(a => (
              <React.Fragment key={a.id}>
                <tr>
                  <td colSpan={dates.length + 2} style={{ padding: "6px 10px", background: BAND_BG[a.id], fontSize: 11, fontWeight: 700, color: C.text, borderBottom: `1px solid ${C.borderLight}` }}>
                    {a.full}
                  </td>
                </tr>
                {byBand[a.id].map(t => {
                  const mine = assignments.filter(x => (x.teamIds || []).includes(t.id));
                  const total = mine.reduce((n, x) => n + toMin(x.end) - toMin(x.start), 0);
                  return (
                    <tr key={t.id}>
                      <td style={{ ...tdStyle, textAlign: "left", fontWeight: 600, fontSize: 12, position: "sticky", left: 0, background: C.surface }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                          <span>{t.name}</span>
                          {!!mine.length && (
                            <button title={`Download ${t.name}'s week as a calendar file`}
                              onClick={() => exportICS(assignments, { teams, rinks, label, teamFilter: t.id })}
                              style={{ ...smallBtn(), padding: "1px 6px", fontSize: 11, lineHeight: 1.4 }}>⤓</button>
                          )}
                        </div>
                      </td>
                      {dates.map(ds => {
                        const day = mine.filter(x => x.date === ds).sort((p, q) => toMin(p.start) - toMin(q.start));
                        return (
                          <td key={ds} style={{ ...tdStyle, textAlign: "center", fontSize: 11 }}>
                            {day.length ? day.map(x => (
                              <div key={x.id} style={{ marginBottom: 2 }}>
                                <div style={{ fontWeight: 600 }}>{fmtRange(toMin(x.start), toMin(x.end))}</div>
                                <div style={{ color: C.textMuted, fontSize: 10 }}>{rinkMap[x.rinkId]?.short}</div>
                              </div>
                            )) : <span style={{ color: C.textLight }}>—</span>}
                          </td>
                        );
                      })}
                      <td style={{ ...tdStyle, textAlign: "center", fontSize: 12, fontWeight: 600, color: total ? C.text : C.textLight }}>
                        {total ? fmtDur(total) : "—"}
                      </td>
                    </tr>
                  );
                })}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>
    </SectionCard>
  );
}

function TeamEditorModal({ team, rinks, onSave, onDelete, onClose }) {
  const [draft, setDraft] = useState(() => ({
    name: "", ageGroup: "u11", level: "A", sessionsPerWeek: 3,
    homeRinkId: "", blackoutDows: [], blackoutDates: [], notes: "", ...team,
  }));
  const [err, setErr] = useState("");
  const [blackoutDraft, setBlackoutDraft] = useState("");
  const set = (k, v) => setDraft(d => ({ ...d, [k]: v }));
  const toggleDow = d => setDraft(x => ({ ...x, blackoutDows: (x.blackoutDows || []).includes(d) ? x.blackoutDows.filter(v => v !== d) : [...(x.blackoutDows || []), d].sort() }));
  const submit = () => {
    if (!draft.name.trim()) return setErr("Give the team a name.");
    onSave({ ...draft, name: draft.name.trim(), id: draft.id || uid("t") });
  };
  return (
    <Modal title={team?.id ? "Edit team" : "Add team"} onClose={onClose} width={480}
      footer={<>
        {team?.id && <button onClick={() => onDelete(team.id)} style={{ ...dangerBtn(), marginRight: "auto" }}>Delete</button>}
        <button onClick={onClose} style={btn()}>Cancel</button>
        <button onClick={submit} style={primaryBtn()}>Save team</button>
      </>}>
      <Field label="Team name">
        <input value={draft.name} onChange={e => set("name", e.target.value)} placeholder="e.g. U13 A" style={{ ...inputStyle, width: "100%" }} />
      </Field>
      <div style={{ display: "flex", gap: 10 }}>
        <Field label="Age group" style={{ flex: 1 }}>
          <select value={draft.ageGroup} onChange={e => set("ageGroup", e.target.value)} style={{ ...inputStyle, width: "100%" }}>
            {AGE_GROUPS.map(a => <option key={a.id} value={a.id}>{a.full}</option>)}
          </select>
        </Field>
        <Field label="Level" style={{ flex: 1 }}>
          <input value={draft.level} onChange={e => set("level", e.target.value)} placeholder="A / B / House" style={{ ...inputStyle, width: "100%" }} />
        </Field>
      </div>
      <div style={{ display: "flex", gap: 10 }}>
        <Field label="Ice times per week" style={{ flex: 1 }}>
          <input type="number" min={0} max={7} value={draft.sessionsPerWeek}
            onChange={e => set("sessionsPerWeek", clamp(Number(e.target.value) || 0, 0, 7))}
            style={{ ...inputStyle, width: "100%" }} />
        </Field>
        <Field label="Home rink" style={{ flex: 1 }} hint="Preferred, not required.">
          <select value={draft.homeRinkId || ""} onChange={e => set("homeRinkId", e.target.value)} style={{ ...inputStyle, width: "100%" }}>
            <option value="">No preference</option>
            {rinks.map(r => <option key={r.id} value={r.id}>{r.short}</option>)}
          </select>
        </Field>
      </div>
      <Field label="Days this team never skates">
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {DOW_SHORT.map((d, i) => {
            const on = (draft.blackoutDows || []).includes(i);
            return (
              <button key={i} onClick={() => toggleDow(i)} style={{
                ...miniChipStyle, padding: "6px 10px", fontSize: 12,
                background: on ? C.red : C.surface, color: on ? C.onAccent : C.text,
                borderColor: on ? C.red : C.border, fontWeight: on ? 600 : 500,
              }}>{d}</button>
            );
          })}
        </div>
      </Field>
      <Field label="Blackout dates" hint="Tournaments, exam week, anything that takes the team off the ice entirely.">
        <div style={{ display: "flex", gap: 8 }}>
          <input type="date" value={blackoutDraft} onChange={e => setBlackoutDraft(e.target.value)} style={{ ...inputStyle, flex: 1 }} />
          <button onClick={() => {
            if (!blackoutDraft) return;
            set("blackoutDates", Array.from(new Set([...(draft.blackoutDates || []), blackoutDraft])).sort());
            setBlackoutDraft("");
          }} style={btn()}>Add</button>
        </div>
        {!!(draft.blackoutDates || []).length && (
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
            {draft.blackoutDates.map(d => (
              <span key={d} style={{ ...miniChipStyle, display: "inline-flex", gap: 6, alignItems: "center" }}>
                {fmtDate(d)}
                <button onClick={() => set("blackoutDates", draft.blackoutDates.filter(x => x !== d))}
                  style={{ background: "transparent", border: "none", color: C.textMuted, cursor: "pointer", fontSize: 13, lineHeight: 1, padding: 0 }}>×</button>
              </span>
            ))}
          </div>
        )}
      </Field>
      <Field label="Notes">
        <input value={draft.notes || ""} onChange={e => set("notes", e.target.value)} placeholder="Optional" style={{ ...inputStyle, width: "100%" }} />
      </Field>
      {err && <div style={{ fontSize: 12, color: C.redText }}>{err}</div>}
    </Modal>
  );
}

function RinkEditorModal({ rink, onSave, onDelete, onClose }) {
  const [draft, setDraft] = useState(() => ({ name: "", short: "", ...rink }));
  const [err, setErr] = useState("");
  const submit = () => {
    if (!draft.name.trim()) return setErr("Give the rink a name.");
    onSave({ ...draft, name: draft.name.trim(), short: (draft.short || draft.name).trim(), id: draft.id || uid("rink") });

  return (
    <Modal title={rink?.id ? "Edit rink" : "Add rink"} onClose={onClose} width={420}
      footer={<>

        <button onClick={onClose} style={btn()}>Cancel</button>
        <button onClick={submit} style={primaryBtn()}>Save rink</button>
      </>}>

// The heart of the constraint set: one row per age band, with the ice
// length and the earliest/latest start times that the allocator treats as
// hard limits.
function RulesEditor({ rules, setRules }) {
  const [showHelp, setShowHelp] = useState(false);
  const update = (band, path, value) => {
    setRules(prev => {
      const next = { ...prev, [band]: { ...ruleFor(prev, band) } };
      if (path.length === 1) next[band][path[0]] = value;
      else next[band][path[0]] = { ...next[band][path[0]], [path[1]]: value };
      return next;
    });
  };
  const cell = { ...tdStyle, textAlign: "center", padding: "6px 6px" };
  const timeInput = { ...inputStyle, padding: "4px 6px", fontSize: 12, width: 112 };
  return (
    <SectionCard
      title="Age group rules"
      subtitle="Hard limits the allocator will not break."
      right={<button onClick={() => setShowHelp(true)} style={{ ...smallBtn(), width: 28, padding: "5px 0" }}>?</button>}
      pad={0}
    >
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 800 }}>
          <thead>
            <tr>
              <th style={{ ...thStyle, textAlign: "left" }}>Age group</th>
              <th style={{ ...thStyle }}>Ice length</th>
              <th style={{ ...thStyle }}>Weeknight start</th>
              <th style={{ ...thStyle }}>Weekend start</th>
              <th style={{ ...thStyle }}>Max/day</th>
              <th style={{ ...thStyle }}>Shared ice</th>
            </tr>
          </thead>
          <tbody>
            {AGE_GROUPS.map(a => {
              const r = ruleFor(rules, a.id);
              return (
                <tr key={a.id}>
                  <td style={{ ...tdStyle, textAlign: "left" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <AgeChip ageGroup={a.id} size={12} />
                      <span style={{ fontSize: 12, color: C.textMuted }}>{a.full.replace(/^\S+\s/, "")}</span>
                    </div>
                  </td>
                  <td style={cell}>
                    <select value={r.durationMin} onChange={e => update(a.id, ["durationMin"], Number(e.target.value))} style={{ ...inputStyle, padding: "4px 6px", fontSize: 12 }}>
                      {[30, 45, 50, 60, 75, 80, 90, 105, 120].map(n => <option key={n} value={n}>{fmtDur(n)}</option>)}
                    </select>
                  </td>
                  <td style={cell}>
                    <div style={{ display: "flex", gap: 4, alignItems: "center", justifyContent: "center" }}>
                      <input type="time" step={900} value={r.weekday.earliest} onChange={e => update(a.id, ["weekday", "earliest"], e.target.value)} style={timeInput} />
                      <span style={{ color: C.textLight, fontSize: 11 }}>to</span>
                      <input type="time" step={900} value={r.weekday.latest} onChange={e => update(a.id, ["weekday", "latest"], e.target.value)} style={timeInput} />
                    </div>
                  </td>
                  <td style={cell}>
                    <div style={{ display: "flex", gap: 4, alignItems: "center", justifyContent: "center" }}>
                      <input type="time" step={900} value={r.weekend.earliest} onChange={e => update(a.id, ["weekend", "earliest"], e.target.value)} style={timeInput} />
                      <span style={{ color: C.textLight, fontSize: 11 }}>to</span>
                      <input type="time" step={900} value={r.weekend.latest} onChange={e => update(a.id, ["weekend", "latest"], e.target.value)} style={timeInput} />
                    </div>
                  </td>
                  <td style={cell}>
                    <input type="number" min={1} max={3} value={r.maxPerDay ?? 1} onChange={e => update(a.id, ["maxPerDay"], clamp(Number(e.target.value) || 1, 1, 3))} style={{ ...inputStyle, padding: "4px 6px", fontSize: 12, width: 52, textAlign: "center" }} />
                  </td>
                  <td style={cell}>
                    <input type="checkbox" checked={!!r.allowShared} onChange={e => update(a.id, ["allowShared"], e.target.checked)} />
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div style={{ padding: "10px 16px", fontSize: 11, color: C.textMuted, borderTop: `1px solid ${C.borderLight}`, lineHeight: 1.5 }}>
        Start windows are about when a team may <em>take</em> the ice. A U9 team with a 6:15p latest start can skate
        until 7:05p — it just can't be handed a 6:30p slot.
      </div>
      {showHelp && (
        <Modal title="How the rules are used" onClose={() => setShowHelp(false)} width={480}
          footer={<button onClick={() => setShowHelp(false)} style={primaryBtn()}>Got it</button>}>
          <div style={{ fontSize: 13, color: C.text, lineHeight: 1.6 }}>
            <p style={{ marginBottom: 10 }}><strong>Ice length</strong> — how long one ice time runs for this band. The allocator carves exactly this much out of a purchased block.</p>
            <p style={{ marginBottom: 10 }}><strong>Weeknight / weekend start</strong> — the earliest and latest a team in this band may be scheduled to <em>start</em>. These are hard: the allocator will leave a request unplaced rather than break one, and hand-edits that break one show up as a conflict.</p>
            <p style={{ marginBottom: 10 }}><strong>Max/day</strong> — how many ice times one team can be given on the same date. Above this the allocator pays a heavy penalty and validation warns.</p>
            <p style={{ marginBottom: 10 }}><strong>Shared ice</strong> — whether two teams in this band can be put on the same sheet at the same time (half-ice or cross-ice). Sharing is rewarded, since it doubles what a block of ice buys.</p>
            <p>Everything else — fairness on prime-time, keeping teams off back-to-back days, home-rink preference, not stranding unusable gaps — is a soft preference the allocator balances rather than a rule it enforces.</p>
          </div>
        </Modal>
      )}
    </SectionCard>
  );
}

// Season-to-date accounting: hours per team, and how the good and bad ice
// got divided up.
function UsageReport({ assignments, teams, rinks, rules }) {
  const [from, setFrom] = useState(SEASON_START);
  const [to, setTo] = useState(addDays(SEASON_START, 209));
  const inRange = useMemo(
    () => assignments.filter(a => a.date >= from && a.date <= to),
    [assignments, from, to]
  );

  const rows = useMemo(() => teams.map(t => {
    const mine = inRange.filter(a => (a.teamIds || []).includes(t.id));
    const minutes = mine.reduce((n, a) => n + toMin(a.end) - toMin(a.start), 0);
    const prime = mine.filter(a => slotQuality(a.date, toMin(a.start)) === "prime").length;
    const rough = mine.filter(a => slotQuality(a.date, toMin(a.start)) === "rough").length;
    const shared = mine.filter(a => (a.teamIds || []).length > 1).length;
    return { team: t, sessions: mine.length, minutes, prime, rough, shared };
  }), [inRange, teams]);

  const maxMinutes = Math.max(1, ...rows.map(r => r.minutes));
  const totalMinutes = rows.reduce((n, r) => n + r.minutes, 0);

  const rinkRows = useMemo(() => rinks.map(r => {
    const mine = inRange.filter(a => a.rinkId === r.id);
    return { rink: r, sessions: mine.length, minutes: mine.reduce((n, a) => n + toMin(a.end) - toMin(a.start), 0) };
  }), [inRange, rinks]);

  // Warm/cool heat scale, recalibrated to whatever range is on screen.
  const heat = v => {
    const p = v / maxMinutes;
    if (p === 0) return { bg: "transparent", color: C.textLight };
    if (p < 0.34) return { bg: C.blueLight, color: C.text };
    if (p < 0.67) return { bg: C.accentLight, color: C.text };
    return { bg: C.orangeLight, color: C.orangeText };
  };

  return (
    <SectionCard
      title="Usage"
      subtitle="Hours delivered, and how the prime ice was shared out."
      right={
        <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
          <input type="date" value={from} onChange={e => setFrom(e.target.value)} style={{ ...inputStyle, padding: "4px 6px", fontSize: 12 }} />
          <span style={{ color: C.textLight, fontSize: 12 }}>to</span>
          <input type="date" value={to} onChange={e => setTo(e.target.value)} style={{ ...inputStyle, padding: "4px 6px", fontSize: 12 }} />
        </div>
      }
      pad={0}
    >
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 620 }}>
          <thead>
            <tr>
              <th style={{ ...thStyle, textAlign: "left" }}>Team</th>
              <th style={{ ...thStyle }}>Ice times</th>
              <th style={{ ...thStyle }}>Hours</th>
              <th style={{ ...thStyle }}>Prime</th>
              <th style={{ ...thStyle }}>Off-peak</th>
              <th style={{ ...thStyle }}>Shared</th>
              <th style={{ ...thStyle, width: 140 }}>Share of ice</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(r => {
              const h = heat(r.minutes);
              return (
                <tr key={r.team.id}>
                  <td style={{ ...tdStyle, textAlign: "left" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <AgeChip ageGroup={r.team.ageGroup} />
                      <span style={{ fontSize: 13, fontWeight: 500 }}>{r.team.name}</span>
                    </div>
                  </td>
                  <td style={{ ...tdStyle, textAlign: "center", fontSize: 12 }}>{r.sessions || "—"}</td>
                  <td style={{ ...tdStyle, textAlign: "center", fontSize: 12, fontWeight: 600, background: h.bg, color: h.color }}>
                    {r.minutes ? (r.minutes / 60).toFixed(1) : "—"}
                  </td>
                  <td style={{ ...tdStyle, textAlign: "center", fontSize: 12, color: r.prime ? C.greenText : C.textLight }}>{r.prime || "—"}</td>
                  <td style={{ ...tdStyle, textAlign: "center", fontSize: 12, color: r.rough ? C.orangeText : C.textLight }}>{r.rough || "—"}</td>
                  <td style={{ ...tdStyle, textAlign: "center", fontSize: 12, color: r.shared ? C.blueText : C.textLight }}>{r.shared || "—"}</td>
                  <td style={{ ...tdStyle, padding: "8px 10px" }}>
                    <div style={{ height: 8, background: C.borderLight, borderRadius: 4, overflow: "hidden" }}>
                      <div style={{ height: 8, width: `${Math.round(r.minutes / maxMinutes * 100)}%`, background: C.accent }} />
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div style={{ padding: "12px 16px", borderTop: `1px solid ${C.borderLight}`, display: "flex", gap: 18, flexWrap: "wrap", fontSize: 12, color: C.textMuted }}>
        <span><strong style={{ color: C.text }}>{(totalMinutes / 60).toFixed(1)}h</strong> delivered in range</span>
        {rinkRows.filter(r => r.sessions).map(r => (
          <span key={r.rink.id}>{r.rink.short}: <strong style={{ color: C.text }}>{(r.minutes / 60).toFixed(1)}h</strong></span>
        ))}
      </div>
    </SectionCard>
  );
}

function TeamsTab({ teams, setTeams, rinks, setRinks, rules, setRules, assignments }) {
  const [editingTeam, setEditingTeam] = useState(null);
  const [editingRink, setEditingRink] = useState(null);
  const byBand = useMemo(() => {
    const map = {};
    for (const t of teams) (map[t.ageGroup] = map[t.ageGroup] || []).push(t);
    return map;
  }, [teams]);

  const saveTeam = t => {
    setTeams(prev => prev.some(x => x.id === t.id) ? prev.map(x => x.id === t.id ? t : x) : [...prev, t]);
    setEditingTeam(null);
  };
  const saveRink = r => {
    setRinks(prev => prev.some(x => x.id === r.id) ? prev.map(x => x.id === r.id ? r : x) : [...prev, r]);
    setEditingRink(null);
  };

  return (
    <div>
      <SectionCard
        title="Teams"
        subtitle={`${teams.length} teams · ${teams.reduce((n, t) => n + (t.sessionsPerWeek || 0), 0)} ice times a week`}
        right={<button onClick={() => setEditingTeam({})} style={primaryBtn()}>Add team</button>}
        pad={0}
      >
        {AGE_GROUPS.filter(a => byBand[a.id]?.length).map(a => (
          <div key={a.id}>
            <div style={{ padding: "6px 16px", background: BAND_BG[a.id], fontSize: 11, fontWeight: 700, borderBottom: `1px solid ${C.borderLight}` }}>{a.full}</div>
            {byBand[a.id].map(t => (
              <div key={t.id} onClick={() => setEditingTeam(t)} style={{
                padding: "10px 16px", borderBottom: `1px solid ${C.borderLight}`,
                display: "flex", alignItems: "center", gap: 10, cursor: "pointer", flexWrap: "wrap",
              }}>
                <span style={{ fontSize: 13, fontWeight: 600 }}>{t.name}</span>
                <span style={{ fontSize: 11, color: C.textMuted }}>{t.level}</span>
                {!!(t.blackoutDows || []).length && (
                  <span style={{ fontSize: 10, color: C.redText, fontWeight: 600 }}>
                    no {(t.blackoutDows).map(d => DOW_SHORT[d]).join("/")}
                  </span>
                )}
                {!!(t.blackoutDates || []).length && (
                  <span style={{ fontSize: 10, color: C.redText, fontWeight: 600 }}>{t.blackoutDates.length} blackout date{t.blackoutDates.length === 1 ? "" : "s"}</span>
                )}
                <span style={{ marginLeft: "auto", fontSize: 12, color: C.textMuted }}>
                  {rinks.find(r => r.id === t.homeRinkId)?.short || "any rink"} · <strong style={{ color: C.text }}>{t.sessionsPerWeek}</strong>/wk
                </span>
              </div>
            ))}
          </div>
        ))}
        {!teams.length && <div style={{ padding: 16, fontSize: 13, color: C.textMuted }}>No teams yet.</div>}
      </SectionCard>

      <SectionCard
        title="Rinks"
        subtitle="The sheets of ice you schedule across."
        right={<button onClick={() => setEditingRink({})} style={btn()}>Add rink</button>}
        pad={0}
      >
        {rinks.map(r => (
          <div key={r.id} onClick={() => setEditingRink(r)} style={{
            padding: "10px 16px", borderBottom: `1px solid ${C.borderLight}`,
            display: "flex", alignItems: "center", gap: 10, cursor: "pointer",
          }}>
            <span style={{ fontSize: 13, fontWeight: 600 }}>{r.name}</span>
            <span style={{ marginLeft: "auto", fontSize: 12, color: C.textMuted }}>{r.short}</span>
          </div>
        ))}
        {!rinks.length && <div style={{ padding: 16, fontSize: 13, color: C.textMuted }}>No rinks yet.</div>}
      </SectionCard>

      <RulesEditor rules={rules} setRules={setRules} />
      <UsageReport assignments={assignments} teams={teams} rinks={rinks} rules={rules} />

      {editingTeam && (
        <TeamEditorModal team={editingTeam} rinks={rinks} onSave={saveTeam}
          onDelete={id => { setTeams(prev => prev.filter(t => t.id !== id)); setEditingTeam(null); }}
          onClose={() => setEditingTeam(null)} />
      )}
      {editingRink && (
        <RinkEditorModal rink={editingRink} onSave={saveRink}
          onDelete={id => { setRinks(prev => prev.filter(r => r.id !== id)); setEditingRink(null); }}
          onClose={() => setEditingRink(null)} />
      )}
    </div>
  );
}

// BACKUP / RESTORE
// The manual escape hatch, independent of whether cloud sync is on.
// ══════════════════════════════════════════════════
function BackupModal({ snapshot, onRestore, onClose }) {
  const fileRef = useRef(null);
  const [pending, setPending] = useState(null);
  const [err, setErr] = useState("");

  const doExport = () => {
    downloadBlob(`ice-data-${dateStr(new Date())}.json`, JSON.stringify(snapshot, null, 2), "application/json");
  };
  const onFile = e => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== "object") throw new Error("not an object");
        setPending(parsed); setErr("");
      } catch (ex) {
        setErr("That file isn't a valid backup.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <Modal title="Data backup" onClose={onClose} width={460}
      footer={<button onClick={onClose} style={btn()}>Close</button>}>
      <div style={{ fontSize: 13, color: C.text, lineHeight: 1.55, marginBottom: 14 }}>
        A snapshot of everything: rinks, teams, purchased ice, the schedule, and the age-group rules.
      </div>
      <div style={{ borderTop: `1px solid ${C.borderLight}`, paddingTop: 14 }}>
        <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6 }}>Download</div>
        <button onClick={doExport} style={btn()}>Download ice-data.json</button>
      </div>
      <div style={{ borderTop: `1px solid ${C.borderLight}`, paddingTop: 14, marginTop: 14 }}>
        <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6 }}>Restore</div>
        <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 8, lineHeight: 1.5 }}>
          Overwrites everything currently loaded. If cloud sync is on, it overwrites it for everyone.
        </div>
        <input ref={fileRef} type="file" accept="application/json,.json" onChange={onFile} style={{ display: "none" }} />
        <button onClick={() => fileRef.current?.click()} style={btn()}>{"Choose file…"}</button>
        {pending && (
          <div style={{ marginTop: 12, background: C.orangeLight, border: `1px solid ${C.orange}`, borderRadius: 8, padding: "10px 12px" }}>
            <div style={{ fontSize: 12, color: C.orangeText, marginBottom: 8, lineHeight: 1.5 }}>
              Ready to restore {(pending.teams || []).length} teams, {(pending.slots || []).length} ice blocks,
              and {(pending.assignments || []).length} scheduled ice times.
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setPending(null)} style={smallBtn()}>Cancel</button>
              <button onClick={() => { onRestore(pending); setPending(null); }} style={{ ...smallBtn(), background: C.accent, borderColor: C.accent, color: C.onAccent, fontWeight: 600 }}>Restore</button>
            </div>
          </div>
        )}
        {err && <div style={{ marginTop: 10, fontSize: 12, color: C.redText }}>{err}</div>}
      </div>
    </Modal>
  );
}

// ══════════════════════════════════════════════════
// APP
// ══════════════════════════════════════════════════
function App() {
  const [hydrated, setHydrated] = useState(false);
  const [cloudState, setCloudState] = useState({ mode: "checking", message: "" });
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem("ice_theme") || "light"; } catch { return "light"; }
  });
  const [tab, setTab] = useState("ice");
  const [weekStart, setWeekStart] = useState(initialWeekStart);

  const [rinks, setRinksRaw] = useState(DEFAULT_RINKS);
  const [teams, setTeamsRaw] = useState(DEFAULT_TEAMS);
  const [slots, setSlotsRaw] = useState([]);
  const [assignments, setAssignmentsRaw] = useState([]);
  const [rules, setRulesRaw] = useState(DEFAULT_RULES);
  const [meta, setMetaRaw] = useState({ publishedWeeks: [], version: DATA_VERSION });

  const [requestOverrides, setRequestOverrides] = useState({});
  const [lastResult, setLastResult] = useState(null);
  const [backupOpen, setBackupOpen] = useState(false);
  const [gate, setGate] = useState(null);   // { action, run }
  const readyRef = useRef(false);

  // Persisting setters: accept a value or an updater, mirror to storage.
  const persist = (key, setter) => next => setter(prev => {
    const value = typeof next === "function" ? next(prev) : next;
    if (readyRef.current) save(key, value);
    return value;
  });
  const setRinks       = useCallback(persist("ice_rinks", setRinksRaw), []);
  const setTeams       = useCallback(persist("ice_teams", setTeamsRaw), []);
  const setSlots       = useCallback(persist("ice_slots", setSlotsRaw), []);
  const setAssignments = useCallback(persist("ice_assignments", setAssignmentsRaw), []);
  const setRules       = useCallback(persist("ice_rules", setRulesRaw), []);
  const setMeta        = useCallback(persist("ice_meta", setMetaRaw), []);

  useEffect(() => { applyTheme(theme); }, []);

  // ── Hydration. Try the cloud; fall back to this device without fuss.
  useEffect(() => {
    let alive = true;
    onCloudResult = r => {
      if (!alive) return;
      if (r.ok) setCloudState({ mode: "cloud", message: "", at: Date.now() });
      else setCloudState({ mode: "error", message: r.message });
    };
    hydrateFromCloud().then(res => {
      if (!alive) return;
      setCloudState(res.ok ? { mode: "cloud", message: "", at: Date.now() } : { mode: "local", message: res.reason });

      const loadedSlots = load("ice_slots", null);
      setRinksRaw(load("ice_rinks", DEFAULT_RINKS));
      setTeamsRaw(load("ice_teams", DEFAULT_TEAMS));
      setSlotsRaw(loadedSlots ?? buildSeedSlots(4));
      setAssignmentsRaw(load("ice_assignments", []));
      setRulesRaw({ ...DEFAULT_RULES, ...load("ice_rules", {}) });
      setMetaRaw(load("ice_meta", { publishedWeeks: [], version: DATA_VERSION }));
      readyRef.current = true;
      // A first-run device has no stored ice; write the seed so everyone
      // starts from the same place.
      if (!loadedSlots) save("ice_slots", buildSeedSlots(4));
      setHydrated(true);
    });
    return () => { alive = false; onCloudResult = () => {}; };
  }, []);

  const toggleTheme = () => {
    const next = theme === "dark" ? "light" : "dark";
    setTheme(next);
    applyTheme(next);
    try { localStorage.setItem("ice_theme", next); } catch {}
    document.body.style.background = next === "dark" ? C_DARK.bg : C_LIGHT.bg;
  };
  useEffect(() => { document.body.style.background = C.bg; }, [theme, hydrated]);

  const publishedWeeks = meta.publishedWeeks || [];
  const isFinalized = publishedWeeks.includes(weekStart);

  // ── Allocate.
  const handleGenerate = ({ keepExisting, requests }) => {
    const dates = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
    const weekSlots = slots.filter(s => dates.includes(s.date) && !s.blocked);
    const existing = assignments.filter(a => dates.includes(a.date));
    const locked = keepExisting ? existing.map(a => ({ ...a })) : [];

    // Anything the caller asked for that's already covered by kept ice
    // shouldn't be requested twice.
    let effective = requests;
    if (keepExisting) {
      const covered = {};
      for (const a of locked) for (const tid of a.teamIds || []) covered[tid] = (covered[tid] || 0) + 1;
      effective = [];
      const used = {};
      for (const r of requests) {
        used[r.teamId] = (used[r.teamId] || 0) + 1;
        if (used[r.teamId] <= (covered[r.teamId] || 0)) continue;
        effective.push(r);
      }
    }

    const sol = solveSchedule({ teams, slots: weekSlots, rules, requests: effective, locked, runs: 60, seed: Math.floor(Math.random() * 100000) });
    setAssignments([...assignments.filter(a => !dates.includes(a.date)), ...sol.assignments]);
    const teamMap = Object.fromEntries(teams.map(t => [t.id, t]));
    setLastResult({
      weekStart,
      placed: sol.assignments.length,
      runs: sol.runs,
      unplaced: sol.unplaced.map(u => ({ ...u, teamName: teamMap[u.teamId]?.name || u.teamId })),
    });
    setTab("schedule");
  };

  const togglePublish = () => {
    const action = isFinalized ? `Unpublish ${weekLabel(weekStart)}` : `Publish ${weekLabel(weekStart)}`;
    setGate({
      action,
      run: () => {
        setMeta(m => ({
          ...m,
          publishedWeeks: isFinalized
            ? (m.publishedWeeks || []).filter(w => w !== weekStart)
            : Array.from(new Set([...(m.publishedWeeks || []), weekStart])),
        }));
        setGate(null);
      },
    });
  };

  const snapshot = { version: DATA_VERSION, rinks, teams, slots, assignments, rules, meta };
  const restore = data => {
    setGate({
      action: "Restore a backup over the current data",
      run: () => {
        if (data.rinks) setRinks(data.rinks);
        if (data.teams) setTeams(data.teams);
        if (data.slots) setSlots(data.slots);
        if (data.assignments) setAssignments(data.assignments);
        if (data.rules) setRules({ ...DEFAULT_RULES, ...data.rules });
        if (data.meta) setMeta(data.meta);
        setGate(null);
        setBackupOpen(false);
      },
    });
  };

  const tabs = [
    { id: "ice",      label: "Ice",         shortLabel: "Ice" },
    { id: "allocate", label: "Allocate",    shortLabel: "Build" },
    { id: "schedule", label: "Schedule",    shortLabel: "Sched" },
    { id: "teams",    label: "Teams & Rules", shortLabel: "Teams" },
  ];

  if (!hydrated) {
    return (
      <div style={{ background: C.bg, minHeight: "100vh", fontFamily: FONT, color: C.textMuted, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ fontSize: 14 }}>Loading ice schedule…</div>
      </div>
    );
  }

  const syncTone = cloudState.mode === "error" ? { c: C.redText, dot: C.red, text: "Sync error" }
                 : cloudState.mode === "cloud" ? { c: C.greenText, dot: C.green, text: "Synced" }
                 : cloudState.mode === "local" ? { c: C.textMuted, dot: C.border, text: "Local only" }
                 : { c: C.textMuted, dot: C.border, text: "Checking…" };

  return (
    <div style={{ background: C.bg, minHeight: "100vh", fontFamily: FONT, color: C.text }}>
      <div style={{ background: C.surface, borderBottom: `1px solid ${C.border}`, padding: "16px 20px", display: "flex", alignItems: "center", boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }}>
        <span style={{ fontFamily: DISPLAY, fontSize: 22, fontWeight: 700, color: C.accent }}>Ice Scheduler</span>
        <span style={{ fontSize: 12, color: C.textMuted, fontWeight: 500, marginLeft: 10 }}>2026–27</span>
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
          <span title={cloudState.mode === "local" ? `Cloud sync is off (${cloudState.message}) — this device only.` : cloudState.message || "Shared schedule"}
                style={{ fontSize: 11, fontWeight: 600, color: syncTone.c, display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ width: 7, height: 7, borderRadius: "50%", display: "inline-block", background: syncTone.dot }} />
            <span>{syncTone.text}</span>
          </span>
          <button onClick={toggleTheme} title={theme === "dark" ? "Switch to light mode" : "Switch to dark mode"} style={{
            fontSize: 14, color: C.textMuted, background: "transparent",
            border: `1px solid ${C.border}`, cursor: "pointer",
            padding: "4px 8px", borderRadius: 4, lineHeight: 1, fontFamily: FONT,
          }}>{theme === "dark" ? "☀" : "☾"}</button>
          <button onClick={() => setBackupOpen(true)} title="Data backup (export / restore)" style={{
            fontSize: 14, color: C.textMuted, background: "transparent",
            border: `1px solid ${C.border}`, cursor: "pointer",
            padding: "4px 8px", borderRadius: 4, lineHeight: 1, fontFamily: FONT,
          }}>{"⚙"}</button>
        </div>
      </div>

      <div style={{ display: "flex", background: C.surface, borderBottom: `1px solid ${C.border}`, overflowX: "auto" }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{
            flex: 1, padding: "12px 0", background: "transparent",
            color: tab === t.id ? C.accent : C.textMuted, border: "none",
            borderBottom: tab === t.id ? `2px solid ${C.accent}` : "2px solid transparent",
            fontFamily: FONT, fontSize: 13, fontWeight: tab === t.id ? 600 : 500,
            cursor: "pointer", whiteSpace: "nowrap", minWidth: 70,
          }}>
            <span className="tab-desktop">{t.label}</span>
            <span className="tab-mobile">{t.shortLabel || t.label}</span>
          </button>
        ))}
      </div>

      <div style={{ maxWidth: 1040, margin: "0 auto", padding: "20px 16px" }}>
        {cloudState.mode === "error" && (
          <div style={{ background: C.redLight, border: `1px solid ${C.red}`, borderRadius: 8, padding: "12px 16px", marginBottom: 16, fontSize: 13, color: C.redText, lineHeight: 1.4 }}>
            <strong>Couldn't save to the shared schedule</strong> — changes are only on this device until this clears. ({cloudState.message})
          </div>
        )}

        {tab === "ice" && (
          <IceTab slots={slots} setSlots={setSlots} assignments={assignments} rinks={rinks} teams={teams} />
        )}
        {tab === "allocate" && (
          <AllocateTab
            weekStart={weekStart} setWeekStart={setWeekStart}
            teams={teams} rinks={rinks} slots={slots} assignments={assignments} rules={rules}
            requestOverrides={requestOverrides} setRequestOverrides={setRequestOverrides}
            onGenerate={handleGenerate} lastResult={lastResult} isFinalized={isFinalized} />
        )}
        {tab === "schedule" && (
          <ScheduleTab
            weekStart={weekStart} setWeekStart={setWeekStart}
            assignments={assignments} setAssignments={setAssignments}
            teams={teams} rinks={rinks} slots={slots} rules={rules}
            isFinalized={isFinalized} onTogglePublish={togglePublish} />
        )}
        {tab === "teams" && (
          <TeamsTab teams={teams} setTeams={setTeams} rinks={rinks} setRinks={setRinks}
            rules={rules} setRules={setRules} assignments={assignments} />
        )}

        <div style={{ textAlign: "center", fontSize: 11, color: C.textLight, padding: "24px 0 8px" }}>
          {cloudState.mode === "local"
            ? "Running on this device only — see ICE_HANDOFF.md to turn on shared sync."
            : "Shared schedule · everyone with the link sees the same board."}
        </div>
      </div>

      {backupOpen && <BackupModal snapshot={snapshot} onRestore={restore} onClose={() => setBackupOpen(false)} />}
      <EditGate open={!!gate} action={gate?.action} onConfirm={() => gate?.run()} onCancel={() => setGate(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
